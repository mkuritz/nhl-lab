<style>

.mb{display:none;background:none;border:0;color:var(--t);font-size:22px;cursor:pointer}#scrim{display:none}
main{margin-left:220px}

main{max-width:1240px;padding:16px}h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}

.tw{overflow-x:auto;max-height:70vh}tr:hover td{background:var(--p2)}
.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.small{font-size:12px}

.pill.leg{background:#3a2a05;border-color:#7a5a10;color:var(--y)}.pill.bk{background:#3a0f18;border-color:#7a1f30;color:var(--r)}.pill.b2b{background:#1d1640;border-color:#46399a;color:var(--v)}
input,select{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:7px 10px;font:inherit}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:6px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}
.cand{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}.cand img{width:44px;height:44px;border-radius:50%;background:var(--p2)}
.ovb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px;font-size:12px}.ovb>div{background:#ffffff0d;border-radius:6px;padding:4px 6px}.ovb span{display:block;font-size:10px;color:var(--m);line-height:1.2}.ovb b{font-size:13px}.ovb b small{font-size:10px;font-weight:600;color:var(--m)}.ovb em{grid-column:1/-1;font-size:10px;color:var(--m);font-style:normal}@media(max-width:600px){.ovb{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cand .pct{margin-left:auto;text-align:right;font-weight:800;font-size:18px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chips span{font-size:11px;padding:1px 7px;border-radius:99px;background:#ffffff12;color:var(--m);white-space:nowrap}.pill.edge{background:#16a34a33;color:#4ade80;font-size:11px}.why{margin:4px 0 0;padding-left:16px;color:var(--m);font-size:12px}
.hero{display:flex;gap:14px;align-items:center}.hero>img{width:84px;height:84px;border-radius:50%;background:var(--p2)}.hero>.pav{flex:0 0 auto;width:68px;height:68px;border-radius:50%;box-sizing:border-box;border:3px solid var(--pc);background:var(--p2);overflow:hidden;display:flex;align-items:center;justify-content:center;font:700 22px/1 system-ui,sans-serif}.hero>.pav img{width:100%;height:100%;object-fit:cover}@media(max-width:480px){.hero>.pav{width:56px;height:56px;font-size:18px}}

.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}.tabs a{padding:7px 12px;border-radius:8px;background:var(--p);border:1px solid var(--b);color:var(--m);font-weight:600;white-space:nowrap}.tabs a.on{background:var(--a);color:#000}
.gS,.gE{color:var(--g);font-weight:700}.gW,.gT{color:var(--r);font-weight:700}.gN{color:var(--m)}.star{cursor:pointer;color:var(--y);font-size:18px;background:none;border:0}

.np .cand{opacity:.55;filter:grayscale(.6)}.np .cand:hover{opacity:.85}.pill.edge{background:#22c55e;color:#04210f;font-weight:800}

.mp-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mp-pill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:1.5px 7px;border-radius:99px;border:1px solid var(--b);background:#16203a;color:#c7d7fe;white-space:nowrap}

.mp-pill.ev1{background:#0f293d;border-color:#1f5882;color:var(--a)}
.mp-pill.xg{background:#1c1638;border-color:#4b398f;color:#d2beff}
.mp-pill.soft{background:#0c2b20;border-color:#1d6b4c;color:var(--g)}
.mp-pill.tough{background:#34111b;border-color:#702237;color:var(--r)}
.mp-pill.pk{background:#122e24;border-color:#246950;color:#6ee7b7}
.nhl-gm-viz{margin-top:6px;padding:6px 8px;background:#0e1629;border:1px solid var(--b);border-radius:8px;font-size:11px;cursor:pointer;transition:border-color .15s,background .15s}.nhl-gm-viz:hover{border-color:var(--a);background:#131f3a}
.nhl-gm-viz .ngv-hd{display:flex;justify-content:space-between;align-items:center;color:var(--m);font-size:10.5px;margin-bottom:3px}
.nhl-gm-viz .ngv-hd b{color:var(--t)}
.nhl-gm-viz .ngv-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#080d1a;gap:2px;margin-bottom:5px}
.nhl-gm-viz .ngv-bar i.a{background:linear-gradient(90deg,#0284c7,#4fc3ff);border-radius:99px 0 0 99px;display:block}
.nhl-gm-viz .ngv-bar i.h{background:linear-gradient(90deg,#059669,#3ddc97);border-radius:0 99px 99px 0;display:block}
.nhl-gm-viz .ngv-gsax{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;padding-top:4px;border-top:1px dashed #1f2b49}
.nhl-viz-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:6px;margin-top:6px;padding:6px 8px;background:#0e1629;border:1px solid var(--b);border-radius:8px;font-size:11px}
.nvs-box{display:flex;flex-direction:column;gap:3px}
.nvs-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--m)}
.nvs-top b{color:var(--t)}
.nvs-track{position:relative;height:6px;border-radius:99px;background:#080d1a;border:1px solid #1e2a48;overflow:hidden;display:flex}
.nvs-track i.ev{background:#4fc3ff;height:100%;display:block}
.nvs-track i.pp{background:#ffc857;height:100%;display:block}
.nvs-therm{position:relative;height:6px;border-radius:99px;background:linear-gradient(90deg,#ff6b7a 0%,#ffc857 50%,#3ddc97 100%);overflow:visible}
.nvs-therm u{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 5px #000}

<header><div class="top"><button id="mb" class="mb" onclick="document.body.classList.toggle('navopen')" aria-label="Menu">☰</button><div class="logo">NHL <span>Lab</span></div><a class="brand" href="https://sportslabshq.com/" title="Sports Labs">▲ Sports Labs</a><div class="seg" id="fmode"></div><div class="badge" id="badge">Loading…</div></div></header>

<script>
const PAVC={"ANA":"#fc4c02","BOS":"#231f20","BUF":"#00468b","CGY":"#dd1a32","CAR":"#e30426","CHI":"#e31937","COL":"#860038","CBJ":"#002d62","DAL":"#20864c","DET":"#e30526","EDM":"#00205b","FLA":"#e51937","LA":"#121212","MIN":"#124734","MTL":"#c41230","NSH":"#fdba31","NJ":"#e30b2b","NYI":"#00529b","NYR":"#0056ae","OTT":"#dd1a32","PHI":"#fe5823","PIT":"#fdb71a","SJ":"#00788a","SEA":"#000d33","STL":"#0070b9","TB":"#003e7e","TOR":"#003e7e","UTAH":"#7ab2e1","VAN":"#003e7e","VGK":"#344043","WSH":"#d71830","WPG":"#002d62","NJD":"#e30b2b","TBL":"#003e7e","LAK":"#121212","SJS":"#00788a","UTA":"#7ab2e1"};function pavI(n){const w=String(n||"").split(/[\s.]+/).filter(Boolean);return ((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase()}

const sanitizeWhy=w=>String(w??'').replace(/\s*[×x]\s?\d+(\.\d+)?/g,'').replace(/\s*\((?:[+−-]?\d+(\.\d+)?%?\s*(?:wt|weight|boost)?)\)/gi,'').replace(/\s{2,}/g,' ').trim();
const LS='nhllab:',V=[['slate','Daily Slate'],['analyst','🎙️ Sports Analyst'],['hot','🔥 Hottest Players'],['watch','★ Watchlist'],['matchups','Matchups'],['fantasy','🏆 Fantasy'],['teams','Teams'],['players','Players'],['lines','Lines'],['news','News'],['war','WAR'],['h2h','H2H Flags'],['goalies','Goalies'],['goaliemap','🥅 Goalie Matchup'],['shotmap','🎯 Shot Map'],['schedule','Schedule']];
const D={},$=s=>document.querySelector(s),pc=x=>x==null?'–':(x*100).toFixed(0)+'%',f=(x,n=2)=>x==null?'–':(+x).toFixed(n),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v))};
const logo=a=>D.teams[a]?`<img loading="lazy" decoding="async" class="tlogo" src="${D.teams[a].logo}" alt="">`:'';
const pl=(id,n)=>`<a href="#player/${id}">${esc(n)}</a>`,tm=a=>`<a href="#team/${a}">${logo(a)}${a}</a>`;
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
async function J(u){const r=await fetch(u+'?v='+(D.meta?.updated||Date.now()));if(!r.ok)throw Error(u);return r.json()}
function sortable(el){el.querySelectorAll('table').forEach(t=>{t.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{const b=t.tBodies[0],rs=[...b.rows],asc=th.dataset.s!=='a';th.dataset.s=asc?'a':'d';
rs.sort((x,y)=>{const a=x.cells[i].dataset.v??x.cells[i].innerText,c=y.cells[i].dataset.v??y.cells[i].innerText,na=parseFloat(a),nc=parseFloat(c);const r=isNaN(na)||isNaN(nc)?a.localeCompare(c):na-nc;return asc?-r:r});rs.forEach(r=>b.appendChild(r))})})}
function tbl(h,rows){return `<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const td=(v,s)=>`<td${s!=null?` data-v="${s}"`:''}>${v}</td>`;

function nhlFormCardHTML(day){
 const fc=D.formCard;if(!fc||!(fc.legs||[]).length||(day&&fc.date&&fc.date!==day))return '';
 const A=a=>a==null?'–':(a>0?'+'+a:''+a),Pc=p=>p==null?'–':Math.round(p*100)+'%';
 const legs=fc.legs||[],par=fc.parlays||[],rr2=fc.round_robin_2s||[],rr3=fc.round_robin_3s||[];
 window._shareNhlFormCard=()=>{if(!window.SLTailCard)return;SLTailCard.show({hub:'NHL LAB',title:fc.title||'NHL Goalscorer Parlay · Recent Form',sub:`${fc.date} · 2-Leg ${par[0]?.best_odds||''} · 3-Leg ${par[1]?.best_odds||''} · 4-Leg ${par[2]?.best_odds||''}`,rows:legs.map(l=>({label:`${l.player} (${l.team} ${l.opp}) · Anytime Goal`,meta:`${l.tag} · L5: ${l.l5.goals}G, ${l.l5.sog_total} SOG, ${l.l5.toi_avg}m TOI`,rightTop:`${A(l.price)} (${l.book})`,rightBot:`Model ${Pc(l.p_model)} vs Fair ${Pc(l.nv)}`})),footerLeft:`2-Leg ${par[0]?.best_odds||''} · 3-Leg ${par[1]?.best_odds||''} · 4-Leg ${par[2]?.best_odds||''}`,filename:`nhl-scorer-parlay-${fc.date}.png`})};
 return `<div class="card" style="grid-column:1/-1;border-color:#2a4f86;background:linear-gradient(135deg,#132444,var(--p) 78%)">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
   <div><h3 style="margin:0">🏒 ${esc(fc.title)} <span class="pill ok">${esc(fc.date)}</span></h3>
   <div class="small m" style="margin-top:3px">${esc(fc.subtitle)}</div></div>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="pill ok">✓ Rest Check: Zero B2B Fatigue (Only LAK on B2B)</span>
    <button type="button" class="sl-tail-btn" onclick="window._shareNhlFormCard()">📸 Share Tail Card</button>
   </div>
  </div>
  ${fc.swap_summary?`<div class="note" style="margin-top:8px">💡 <b>Lineup Swap Note:</b> ${esc(fc.swap_summary)}</div>`:''}
  <div class="grid" style="margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(275px,1fr))">
   ${legs.map(l=>{const bq=(l.book_quotes||[]).slice(0,4).map(q=>`${esc(q.book)} ${A(q.price)}`).join(' · ');
    const pillCls=/Hot Form/.test(l.tag||'')?'ok':/Due/.test(l.tag||'')?'ev1':'proj';
    return `<div style="background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:10px 12px">
     <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
      <div><b>${l.slot}. ${pl(l.nhl_id,l.player)}</b> <span class="m small">${tm(l.team)} ${esc(l.opp)} · ${esc(l.time_et)}</span></div>
      <div style="text-align:right"><b class="g" style="font-size:15px">${A(l.price)}</b> <span class="m small">${esc(l.book)}</span></div>
     </div>
     <div style="margin-top:4px"><span class="pill ${pillCls}">${esc(l.tag)}</span> <span class="small m">Model <b>${Pc(l.p_model)}</b> vs Fair <b>${Pc(l.nv)}</b> (${l.edge>=0?'+':''}${Math.round(l.edge*100)} pts)</span></div>
     ${res({pid:l.nhl_id,gid:l.gid},'pG')}
     <div class="small" style="margin-top:5px"><b>L5 (${l.l5.goals}G, ${l.l5.assists}A, ${l.l5.sog_total} SOG · ${l.l5.toi_avg}m TOI):</b> ${esc(l.form_note)}</div>
     <div class="small m" style="margin-top:3px"><b>Matchup:</b> ${esc(l.opp_note)}${bq?` · <b>Books:</b> ${bq}`:''}</div>
    </div>`}).join('')}
  </div>
  <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--b)">
   <div style="font-weight:800;font-size:13px;margin-bottom:6px">📋 Parlay &amp; Round-Robin Combos (Anytime Goalscorer)</div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px">
    ${par.map(p=>`<div style="background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:8px 10px">
     <div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(p.title)}</b><b class="g">${esc(p.best_odds)}</b></div>
     <div class="small m" style="margin-top:2px">${esc(p.players.join(' + '))}</div>
     <div class="small m" style="margin-top:3px">Book A <b>${esc(p.dk_odds)}</b> · Book B <b>${esc(p.fd_odds)}</b> · Combined <b>${(p.p_model*100).toFixed(1)}%</b> (EV <b class="g">+${(p.ev_best*100).toFixed(1)}%</b>)</div>
    </div>`).join('')}
   </div>
   <details style="margin-top:8px"><summary class="small m" style="cursor:pointer;font-weight:700">View all 2-Leg (6x) &amp; 3-Leg (4x) Round-Robin pairs + Rest Note</summary>
    <div class="small m" style="margin-top:6px"><b>2-Leg Pairs:</b> ${rr2.map(r=>`${esc(r.pair)} (<b class="g">${esc(r.best_odds)}</b> / Book A ${esc(r.dk_odds)} · ${(r.p_model*100).toFixed(1)}%)`).join(' · ')}</div>
    <div class="small m" style="margin-top:4px"><b>3-Leg Trios:</b> ${rr3.map(r=>`${esc(r.trio)} (<b class="g">${esc(r.best_odds)}</b> / Book A ${esc(r.dk_odds)} · ${(r.p_model*100).toFixed(1)}%)`).join(' · ')}</div>
    <div class="small m" style="margin-top:4px">${esc(fc.rest_summary||'')}</div>
   </details>
  </div>
 </div>`;
}

const ESPN_AB={"LAK":"LA","NJD":"NJ","SJS":"SJ","TBL":"TB","UTA":"UTAH","MTL":"MTL"};
const AB_ESPN=Object.fromEntries(Object.entries(ESPN_AB).map(([a,b])=>[b,a]));

async function pullLive(){
  try{
    const [lsData,live]=await Promise.all([
      (window.LR&&window.LR.data)?Promise.resolve(window.LR.data):fetch('https://betlab.sportslabshq.com/data/live_stats.json?t='+Math.floor(Date.now()/60000)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('https://raw.githubusercontent.com/mkuritz/nhl-lab/live/live.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(live){live.games.forEach(g=>LIVE.games[g.id]=Object.assign(LIVE.games[g.id]||{},g));(live.goalies||[]).forEach(g=>LIVE.goalies[g.gid+'-'+g.team]=g);LIVE.src=live.updatedET;LIVE.stats=live.stats||{}}
    if(lsData&&lsData.g){Object.entries(lsData.g).forEach(([k,v])=>{if(!k.startsWith('nhl|')||!Array.isArray(v))return;

      const aAb=AB_ESPN[awRaw]||awRaw,hAb=AB_ESPN[hmRaw]||hmRaw;
      const dStr=iso?new Date(iso).toLocaleDateString('en-CA',{timeZone:'America/New_York'}):'';

      if(!g)return;const state=stKey==='post'?'OFF':stKey==='in'?'LIVE':stKey==='pre'?'FUT':g.state;
      LIVE.games[g.id]=Object.assign(LIVE.games[g.id]||{},{id:g.id,state,as_:+as_||0,hs:+hs||0,detail:detail||''});
    })}
    LIVE.ts=Date.now();
  }catch(e){console.warn('live',e)}
}

let h=`<h2>🏆 Fantasy Lab <span class="m small">${esc(scName())} scoring</span></h2><div class="tabs">${T.map(([k,l])=>`<a onclick="fantasy._t='${k}';ls.set('ftab','${k}');route()" class="${k===tab?'on':''}">${l}</a>`).join('')}</div>`;
const k=curWeek(),W=FX().weeks.find(w=>w.key===k);const SK=D.players.filter(x=>x.pos!=='G'),GL=D.players.filter(x=>x.pos==='G');
if(tab==='weekly'){const pos=ls.get('fwpos','all');const rows=SK.filter(x=>pos==='all'||(pos==='D'?x.pos==='D':pos==='C'?x.pos==='C':pos==='W'?(x.pos==='L'||x.pos==='R'):true)).map(x=>({x,w:wkProj(x.id,false,k)})).filter(r=>r.w.n).sort((a,b)=>b.w.fp-a.w.fp).slice(0,200);
const gr=GL.map(x=>({x,w:wkProj(x.id,true,k)})).filter(r=>r.w.n).sort((a,b)=>b.w.fp-a.w.fp);
h+=`<div class="filters">${weekSel()}<select onchange="ls.set('fwpos',this.value);route()">${[['all','All skaters'],['C','C'],['W','LW/RW'],['D','D']].map(([v,l])=>`<option value="${v}"${v===pos?' selected':''}>${l}</option>`).join('')}</select></div>
<div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><h3>Skaters: projected FP, ${wkLabel(W)}</h3>${tbl(['Player','Team','Pos','Games','Opponents','Proj FP','FP/gm','Own%'],rows.map(({x,w})=>`<tr>${td(starBtn(x.id)+pl(x.id,x.name),x.name)}${td(x.team)}${td(x.pos)}${td(w.n)}${td(`<span class="small">${w.opp.join(' ')}</span>`)}${td('<b>'+f(w.fp,1)+'</b>',w.fp)}${td(f(w.fp/w.n,2),w.fp/w.n)}${td(ownS(x.id),own(x.id)??-1)}</tr>`))}</div>
<div class="card"><h3>Goalies: projected starts & FP</h3>${tbl(['Goalie','Team','Starts','Proj FP'],gr.map(({x,w})=>`<tr>${td(pl(x.id,x.name)+(w.alt?' <span class="pill bk">'+w.alt+' alt</span>':''),x.name)}${td(x.team)}${td(w.n)}${td('<b>'+f(w.fp,1)+'</b>',w.fp)}</tr>`))}<p class="small m">Starts are projected (heuristic: usual No. 1, with the backup on the 2nd night of back-to-backs and anyone on the injury report skipped). * = projected as alternate start.</p></div></div>
<p class="small m">Projected fantasy points for each game, adjusted for the matchup.</p>`}
if(tab==='startsit'){const rows=SK.filter(x=>(own(x.id)??0)>=50).map(x=>{const w=wkProj(x.id,false,k),r=FX().sk[x.id];const norm=r?fsk(r.r)*3.5:0;return {x,w,idx:norm?w.fp/norm:0,norm}}).filter(r=>r.norm>0);
const start=[...rows].filter(r=>r.w.n>=3).sort((a,b)=>b.idx-a.idx).slice(0,25),sit=[...rows].sort((a,b)=>a.idx-b.idx).slice(0,25);
const t=arr=>tbl(['Player','Team','Own%','Games','Opponents','Proj FP','vs typical week'],arr.map(({x,w,idx,norm})=>`<tr>${td(starBtn(x.id)+pl(x.id,x.name),x.name)}${td(x.team)}${td(ownS(x.id),own(x.id))}${td(w.n)}${td(`<span class="small">${w.opp.join(' ')}</span>`)}${td(f(w.fp,1),w.fp)}${td(`<span class="${idx>=1.1?'g':idx<=0.85?'r':''}">${idx>=1?'+':''}${f((idx-1)*100,0)}%</span>`,idx)}</tr>`));
h+=`<div class="filters">${weekSel()}</div><div class="note">Who has the best and worst schedule this week. Start = biggest boosts, Sit = biggest drops.</div><br>
<div class="grid"><div class="card"><h3 class="g">Start (boosted week)</h3>${t(start)}</div><div class="card"><h3 class="r">Sit / consider benching</h3>${t(sit)}</div></div>`}
if(tab==='waiver'){const H=Object.fromEntries(D.hot.map(x=>[x.pid,x]));const rows=SK.filter(x=>own(x.id)!=null&&own(x.id)<30).map(x=>({x,h:H[x.id],w:wkProj(x.id,false,k)})).filter(r=>r.h&&(r.h.score>0.15||(r.h.toiDelta||0)>=1.5)).sort((a,b)=>b.w.fp-a.w.fp).slice(0,40);
h+=`<div class="filters">${weekSel()}</div><div class="note">Widely available players who are heating up or getting more ice time.</div><br>
<div class="card">${tbl(['Player','Team','Pos','Own%','L5 G-P','L5 TOI','TOI Δ','Pt strk','Wk games','Wk proj FP','Why'],rows.map(({x,h:q,w})=>{const why=[];if(q.score>0.15)why.push('hot vs baseline');if((q.toiDelta||0)>=1.5)why.push(`+${f(q.toiDelta,1)} min TOI`);if(q.ptStreak>=3)why.push(q.ptStreak+'-gm pt streak');if(w.n>=4)why.push(w.n+' games');
return `<tr>${td(starBtn(x.id)+pl(x.id,x.name),x.name)}${td(x.team)}${td(x.pos)}${td(ownS(x.id),own(x.id))}${td(`${q.l5.g}-${q.l5.p}`,q.l5.p)}${td(f(q.l5.toi,1))}${td(q.toiDelta==null?'–':f(q.toiDelta,1),q.toiDelta??-9)}${td(q.ptStreak)}${td(w.n)}${td('<b>'+f(w.fp,1)+'</b>',w.fp)}<td class="l small">${why.join(' · ')}</td></tr>`}))}</div>`}
if(tab==='grid'){const A=Object.keys(D.teams).sort();const Wk=FX().weeks.filter(w=>A.some(a=>FX().grid[a][w.key].n));const col=c=>c==null?'':c>=1.06?'background:#0f3326':c<=0.94?'background:#3a1420':'';
h+=`<div class="card">${tbl(['Team',...Wk.map(w=>wkLabel(w)),'Total'],A.map(a=>{const G=FX().grid[a];const tot=Wk.reduce((t,w)=>t+G[w.key].n,0);return `<tr>${td(tm(a),a)}${Wk.map(w=>{const c=G[w.key];return `<td data-v="${c.n+(c.off||0)/10}" style="${col(c.off)}" title="${c.opp.join(' ')}"><b>${c.n}</b> <span class="small m">${c.off?f(c.off,2):''}${c.b2b?' B2B':''}</span></td>`}).join('')}${td('<b>'+tot+'</b>',tot)}</tr>`}))}
<p class="small m">Bold = games that week. Small number = average offense matchup index (1.00 = average; green ≥1.06 easier, red ≤0.94 tougher). Hover for opponents. Sort any column.</p></div>`}
if(tab==='streamers'){const rows=GL.filter(x=>(own(x.id)??0)<50).map(x=>({x,w:wkProj(x.id,true,k),d:FX().g[x.id]?.[k]})).filter(r=>r.w.n).sort((a,b)=>b.w.fp/b.w.n-a.w.fp/a.w.n).slice(0,25);
h+=`<div class="filters">${weekSel()}</div><div class="note">Widely available goalies with starts this week, best first.</div><br>
<div class="card">${tbl(['Goalie','Team','Own%','Proj starts','Opponents','xW','xGA/start','Proj FP','FP/start'],rows.map(({x,w,d})=>`<tr>${td(pl(x.id,x.name),x.name)}${td(x.team)}${td(ownS(x.id),own(x.id))}${td(w.n)}${td(`<span class="small">${w.opp.join(' ')}</span>`)}${td(f(d.c[0],2))}${td(f(d.c[2]/w.n,2),d.c[2]/w.n)}${td('<b>'+f(w.fp,1)+'</b>',w.fp)}${td(f(w.fp/w.n,2),w.fp/w.n)}</tr>`))}</div>`}
if(tab==='scoring'){const p=ls.get('fpreset','espn'),cv=SC();h+=`<div class="card"><h3>Scoring preset</h3><select onchange="ls.set('fpreset',this.value);route()"><option value="espn"${p==='espn'?' selected':''}>Standard points</option><option value="custom"${p==='custom'?' selected':''}>Custom</option></select>
<p class="small">Default points scoring: G 2, A 1, PPP 0.5, SHP 0.5, SOG 0.1, HIT 0.1, BLK 0.5. Goalies: W 4, GA −2, SV 0.2, SO 3, OTL 1. Common default scoring for points leagues. Your league may differ.</p>
<p class="small m">Yahoo preset is not included. Public sources disagree on Yahoo's current defaults (the setup page and older help articles list different values), and I couldn't verify them from Yahoo directly. Enter your Yahoo league's values under Custom.</p></div>
<div class="card"><h3>Custom scoring ${p!=='custom'?'<span class="m small">(select "Custom" to apply)</span>':''}</h3><div class="kv">${[...SKK,...GOK].map(k2=>`<div>${k2}<input type="number" step="0.1" value="${cv[k2]}" style="width:100%" onchange="const c=ls.get('fcustom',{});c['${k2}']=+this.value;ls.set('fcustom',c);ls.set('fpreset','custom')"></div>`).join('')}</div>
<p class="small m">Saved in this browser. Changing any value switches to Custom. PIM and +/- are available for custom leagues (default = 0).</p><a class="pill" onclick="ls.set('fcustom',{});ls.set('fpreset','espn');route()">Reset to default</a></div>`}
return h}

async function analyst(){if(!window.NHLAnalyst){await new Promise(r=>{const sc=document.createElement('script');sc.src='https://betlab.sportslabshq.com/nhl-analyst.js?v=1';sc.onload=sc.onerror=r;document.head.appendChild(sc)})}
setTimeout(()=>{const el=$('#anbox');if(el&&window.NHLAnalyst)NHLAnalyst(el,{base:'data/',pad:0,plink:(id,n)=>pl(id,n)})},0);return window.NHLAnalyst?'<div id="anbox"></div>':'<div class="card m">Sports Analyst is unavailable right now.</div>'}
function linkNames(root){if(!D.players)return;if(!linkNames.M){linkNames.M={};D.players.forEach(p=>{const k=p.name.toLowerCase();(linkNames.M[k]=linkNames.M[k]||[]).push(p)})}const M=linkNames.M;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,button,select,option,th,input,textarea,script,style,h2')||!/\S/.test(n.nodeValue)?2:1});const L=[];let n;while(n=w.nextNode())L.push(n);
 L.forEach(t=>{const v=t.nodeValue,m=/^(\s*)([A-ZÀ-Ž][\wÀ-ž.'’-]*(?:\s+[A-ZÀ-Ž][\wÀ-ž.'’-]*){1,3})/.exec(v);if(!m)return;const ws=m[2].split(/\s+/);for(let k=ws.length;k>=2;k--){const nm=ws.slice(0,k).join(' '),c=M[nm.toLowerCase()];if(!c)continue;const after=v.charAt(m[1].length+nm.length);if(after&&/[A-Za-z]/.test(after))continue;
  let x=c.length==1?c[0]:null;if(!x){const row=t.parentElement.closest('tr,div');const tt=row?row.textContent:'';x=c.find(p=>tt.includes(p.team))||null}if(!x)return;
  const r=t.splitText(m[1].length);r.nodeValue=r.nodeValue.slice(nm.length);const a=document.createElement('a');a.href='#player/'+x.id;a.textContent=nm;r.parentNode.insertBefore(a,r);return}})}
async function shotlab(v,arg){if(!window.NHLShot)await new Promise(r=>{const sc=document.createElement('script');sc.src='shotlab.js?v=1';sc.onload=sc.onerror=r;document.head.appendChild(sc)});if(!window.NHLShot)return '<div class="card m">Shot maps are unavailable right now.</div>';setTimeout(()=>{const el=$('#smbox');if(el)NHLShot(el,v==='goaliemap'?'g':'s',arg,{D})},0);return '<div id="smbox" data-sl-public><div class="card m">Loading shot map…</div></div>'}
/* shotlab hook: player profile link */const smLink=p=>p&&p.id?`<div class="filters">${p.pos==='G'?`<a class="pill" href="#goaliemap/${p.id}">🥅 Goalie Matchup map ›</a>`:`<a class="pill" href="#shotmap/${p.id}">🎯 Shot Map ›</a>`}</div>`:'';
async function route(){if(!D.teams)return;const [v,arg,arg2]=(location.hash.slice(1)||'slate').split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='team'&&a.dataset.t===arg)));document.body.classList.remove('navopen');
const el=$('#app');try{const html=(v==='goaliemap'||v==='shotmap')?await shotlab(v,arg):v==='player'?await player(arg):v==='team'?team(arg,arg2):v==='watch'?await watch():v==='analyst'?await analyst():({slate,schedule,teams,players,war,h2h,goalies,method,hot,matchups,lines,news,fantasy}[v]||slate)();el.innerHTML=html;sortable(el);try{linkNames(el)}catch(e){}}catch(e){console.error(e);el.innerHTML='<div class="card r">Something went wrong rendering this view.</div>'}
if(v!==route._v)scrollTo(0,0);route._v=v}
(async()=>{
try{D.meta=await J('data/meta.json');$('#badge').textContent='Data updated '+D.meta.updatedET;
const ks=['teams','games','players','slate','model','goalies','hot','grades','teamx','lines','news','fantasy'];const r=await Promise.all([...ks.map(k=>J(`data/${k}.json`)),J('data/h2h_flags.json')]);ks.forEach((k,i)=>D[k]=r[i]);D.h2h=r[ks.length];

    title:`${r.name} (${r.team} ${r.pos} ${r.home?'vs':'@'} ${r.opp})`,
    sub:`Highlighted Skater Callout · ${mktLbl}${r.goalie?' · vs '+r.goalie:''}`,
    rows:[{
     player:r.name,market:mktLbl,line:lnLbl,
     meta:`Model Chance: ${pc(o)} · xSOG ${f(r.xs||2.4,1)}${r.pp_unit?' · '+r.pp_unit:''}${r.g_gsax!=null?' · Opp G L10 '+(r.g_gsax>0?'+':'')+f(r.g_gsax,1)+' GSAx':''}`,
     rightTop:m&&m.best!=null?`${am(m.best)} (${m.book||'Book A'})`:`Model ${pc(o)}`,
     rightBot:m&&m.fair!=null?`Book Fair ${pc(m.fair)}`:'MoneyPuck Flurry-Adj xG'
    }],
    footerLeft:`Sports Labs NHL Model: ${pc(o)} (${mktLbl})`,
    footerRight:'nhllab.sportslabshq.com · 21+',
    filename:`nhllab-${r.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.png`
   });
  }
 }
});
