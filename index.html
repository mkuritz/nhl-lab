<style>
:root{--bg:#0b1020;--p:#131a2e;--p2:#1a2340;--b:#26304f;--t:#e6ebff;--m:#8d97b8;--a:#4fc3ff;--g:#3ddc97;--r:#ff6b7a;--y:#ffc857;--v:#b28dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--a);text-decoration:none;cursor:pointer}header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--b)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}.logo{font-weight:800;font-size:18px;letter-spacing:.3px}.logo span{color:var(--a)}
.brand{font-size:11px;font-weight:700;color:var(--m);border:1px solid var(--b);border-radius:6px;padding:2px 7px;letter-spacing:.04em}.seg{margin-left:auto;display:flex;border:1px solid var(--b);border-radius:99px;overflow:hidden}.seg a{padding:4px 10px;font-size:12px;font-weight:700;color:var(--m)}.seg a.on{background:var(--v);color:#000}
.badge{font-size:12px;color:var(--m);background:var(--p);border:1px solid var(--b);padding:4px 10px;border-radius:99px;white-space:nowrap}

nav .tl{display:none;padding-left:8px}nav .tl.open{display:block}nav .tl a{padding:4px 10px;font-weight:500;font-size:13px}nav .sec{font-size:11px;color:#5d678a;text-transform:uppercase;letter-spacing:.08em;padding:12px 12px 4px}
.mb{display:none;background:none;border:0;color:var(--t);font-size:22px;cursor:pointer}#scrim{display:none}
main{margin-left:220px}
@media(max-width:860px){aside{transform:translateX(-100%);transition:transform .2s}body.navopen aside{transform:none}.mb{display:block}main{margin-left:0}body.navopen #scrim{display:block;position:fixed;inset:0;background:#0008;z-index:3}}

.tw{overflow-x:auto;max-height:70vh}tr:hover td{background:var(--p2)}
.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.small{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--p2);border:1px solid var(--b);margin:1px 2px}
.pill.leg{background:#3a2a05;border-color:#7a5a10;color:var(--y)}.pill.bk{background:#3a0f18;border-color:#7a1f30;color:var(--r)}.pill.b2b{background:#1d1640;border-color:#46399a;color:var(--v)}
input,select{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:7px 10px;font:inherit}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:6px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}
.cand{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}.cand img{width:44px;height:44px;border-radius:50%;background:var(--p2)}
.cand .pct{margin-left:auto;text-align:right;font-weight:800;font-size:18px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chips span{font-size:11px;padding:1px 7px;border-radius:99px;background:#ffffff12;color:var(--m);white-space:nowrap}.pill.edge{background:#16a34a33;color:#4ade80;font-size:11px}.why{margin:4px 0 0;padding-left:16px;color:var(--m);font-size:12px}
.hero{display:flex;gap:14px;align-items:center}.hero>img{width:84px;height:84px;border-radius:50%;background:var(--p2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.kv div{background:var(--p2);border-radius:8px;padding:8px}.kv b{display:block;font-size:17px}
.note{background:#10203a;border:1px solid #1f3f6a;border-radius:10px;padding:10px;font-size:12px;color:#b8cdf0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}.tabs a{padding:7px 12px;border-radius:8px;background:var(--p);border:1px solid var(--b);color:var(--m);font-weight:600;white-space:nowrap}.tabs a.on{background:var(--a);color:#000}
.gS,.gE{color:var(--g);font-weight:700}.gW,.gT{color:var(--r);font-weight:700}.gN{color:var(--m)}.star{cursor:pointer;color:var(--y);font-size:18px;background:none;border:0}
.tlogo{width:20px;height:20px;vertical-align:middle;margin-right:4px}
.pill.riv{background:#3a1a2e;border-color:#7a3a5a;color:#ff9ec0}.pill.ok{background:#0c2b20;border-color:#1d6b4c;color:var(--g)}.pill.proj{background:#2a2205;border-color:#6b5512;color:var(--y)}
.wl-add{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.wl-add .dd{position:relative;flex:1;min-width:220px}.wl-add .dd ul{position:absolute;z-index:6;left:0;right:0;max-height:260px;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;margin:4px 0 0;padding:0;list-style:none}.wl-add .dd li{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--b)}.wl-add .dd li:hover{background:var(--p2)}.sug{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)!important}.grid>*{min-width:0}.brand{display:none}.badge{display:none}main{padding:10px}th,td{padding:6px 5px}.hide-m{display:none}}

<header><div class="top"><button id="mb" class="mb" onclick="document.body.classList.toggle('navopen')" aria-label="Menu">☰</button><div class="logo">NHL <span>Lab</span></div><a class="brand" href="https://sportslabshq.com/" title="Sports Labs">▲ Sports Labs</a><div class="seg" id="fmode"></div><div class="badge" id="badge">Loading…</div></div></header>
<aside id="side"><nav id="nav"></nav></aside><div id="scrim" onclick="document.body.classList.remove('navopen')"></div><main id="app"><div class="card">Loading data…</div></main>
<script>
const sanitizeWhy=w=>String(w??'').replace(/\s*[×x]\s?\d+(\.\d+)?/g,'').replace(/\s*\((?:[+−-]?\d+(\.\d+)?%?\s*(?:wt|weight|boost)?)\)/gi,'').replace(/\s{2,}/g,' ').trim();
const LS='nhllab:',V=[['slate','Daily Slate'],['analyst','🎙️ Sports Analyst'],['hot','🔥 Hottest Players'],['watch','★ Watchlist'],['matchups','Matchups'],['fantasy','🏆 Fantasy'],['teams','Teams'],['players','Players'],['lines','Lines'],['news','News'],['war','WAR'],['h2h','H2H Flags'],['goalies','Goalies'],['schedule','Schedule']];
const D={},$=s=>document.querySelector(s),pc=x=>x==null?'–':(x*100).toFixed(0)+'%',f=(x,n=2)=>x==null?'–':(+x).toFixed(n),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v))};
const logo=a=>D.teams[a]?`<img loading="lazy" decoding="async" class="tlogo" src="${D.teams[a].logo}" alt="">`:'';
const pl=(id,n)=>`<a href="#player/${id}">${esc(n)}</a>`,tm=a=>`<a href="#team/${a}">${logo(a)}${a}</a>`;
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
async function J(u){const r=await fetch(u+'?v='+(D.meta?.updated||Date.now()));if(!r.ok)throw Error(u);return r.json()}
function sortable(el){el.querySelectorAll('table').forEach(t=>{t.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{const b=t.tBodies[0],rs=[...b.rows],asc=th.dataset.s!=='a';th.dataset.s=asc?'a':'d';
rs.sort((x,y)=>{const a=x.cells[i].dataset.v??x.cells[i].innerText,c=y.cells[i].dataset.v??y.cells[i].innerText,na=parseFloat(a),nc=parseFloat(c);const r=isNaN(na)||isNaN(nc)?a.localeCompare(c):na-nc;return asc?-r:r});rs.forEach(r=>b.appendChild(r))})})}
function tbl(h,rows){return `<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const td=(v,s)=>`<td${s!=null?` data-v="${s}"`:''}>${v}</td>`;

function slate(){const s=D.slate,days=s.days,TD=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});let day=ls.get('day',days.includes(TD)?TD:days[0]);if(!days.includes(day))day=days.includes(TD)?TD:days[0];const rel=d=>{const x=(new Date(d+'T12:00')-new Date(TD+'T12:00'))/864e5;return x===-1?'Yesterday':x===0?'Today':x===1?'Tomorrow':fmtD(d)};
const gs=D.games.filter(g=>g.date===day),rows=s.rows.filter(r=>r.date===day);const pos=ls.get('slpos','all');
const R=rows.filter(r=>pos==='all'||(pos==='D'?r.pos==='D':r.pos!=='D'));
const gq=s.goalies.filter(g=>g.date===day);
let h=`<h2>Daily Slate</h2><div class="filters">${days.map(d=>`<a class="pill" style="${d===day?'background:var(--a);color:#000':''}" onclick="ls.set('day','${d}');route()">${rel(d)}</a>`).join('')}
<select onchange="ls.set('slpos',this.value);route()">${[['all','All skaters'],['F','Forwards'],['D','Defense']].map(([v,l])=>`<option value="${v}"${v===pos?' selected':''}>${l}</option>`).join('')}</select></div>
<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Games (${gs.length})</h3><div class="grid">${gs.map(g=>{const ga=gq.find(x=>x.gid===g.id&&x.team===g.away),gh=gq.find(x=>x.gid===g.id&&x.team===g.home);
const gl=x=>x?`${x.gid_?pl(x.gid_,x.goalie):'?'} <span class="m">${f(x.sv,3)}</span>${x.backup?' <span class="pill bk">BACKUP/ALT</span>':''}`:'–';
const L=liveG(g);const Ga=gStatus(ga||{gid:g.id,team:g.away}),Gh=gStatus(gh||{gid:g.id,team:g.home});
const gl2=x=>{if(!x||!x.goalie)return'–';const st=x.status||'Projected';return `${x.gid_?pl(x.gid_,x.goalie):esc(x.goalie)} <span class="pill ${st==='Confirmed'?'ok':'proj'}" title="${esc((x.source||'')+' · '+(x.asOf||''))}">${st}</span>${x.backup?' <span class="pill bk">BACKUP/ALT</span>':''}`};
const score=L.hs!=null||L.as_!=null;const live=score&&L.state!=='OFF'&&L.state!=='FINAL';
return `<div><b>${tm(g.away)} @ ${tm(g.home)}</b> <span class="m">${g.time} ET</span> ${rivPill(g)} ${g.aB2B?'<span class="pill b2b">'+g.away+' B2B</span>':''}${g.hB2B?'<span class="pill b2b">'+g.home+' B2B</span>':''}
<div class="small m">${score?`<b class="${live?'y':'g'}">${L.state==='OFF'||L.state==='FINAL'?'Final':(L.detail||('P'+(L.period||'')+' '+ (L.clock||'Live')))}</b>: ${g.away} <b>${L.as_??0}</b> – ${g.home} <b>${L.hs??0}</b>${L.sogA!=null?` · SOG ${L.sogA}-${L.sogH}`:''}`:`Goalies: ${gl2(Ga)} vs ${gl2(Gh)}`}</div></div>`}).join('')||'<span class="m">No games.</span>'}</div>
<p class="small m">Scores refresh about every minute during games (live scoreboard feed). Goalies: <span class="pill ok">Confirmed</span> = NHL boxscore starter or Daily Faceoff confirmed; <span class="pill proj">Projected</span> = our model (starts, B2B, injury report). Rivalry tags are labels only — they do not move projections.</p></div>
<div class="card" style="grid-column:1/-1">${slTabs(R,day)}</div>
<div class="card"><h3>Notable spots</h3>${notable(R)}</div></div>`;return h}
function res(r,k){const x=(LIVE.stats||{})[r.pid];if(!x||x[3]!==r.gid)return'';const [g,a,sg]=x,L=LIVE.games[r.gid]||D.games.find(q=>q.id===r.gid)||{},fin=L.state==='OFF'||L.state==='FINAL',hit=k==='pG'?g>0:k==='p3S'?sg>=3:g+a>0;
const per=+L.period||0,clk=fin?'Final':(per?(per>3?'OT':'P'+per)+' '+(L.clock||''):'Live'),gt=(x[4]||[]).join(' · '),pr=fin?100:Math.min(100,Math.round(100*(per-1+0.5)/3));
const st=`${g}G ${a}A · ${sg} SOG${gt?' · G '+gt:''} · ${clk}`;const c=hit?'var(--g,#4ade80)':fin?'var(--r,#f87171)':'#facc15';
return `<div class="small" style="font-weight:700;color:${c}">${hit?'✓':fin?'✗':'●'} ${st}</div>${!fin&&!hit?`<div style="height:3px;background:#ffffff1a;border-radius:2px;margin-top:2px"><div style="height:3px;width:${pr}%;background:${c};border-radius:2px"></div></div>`:''}`}
function slTabs(R,day){const t=ls.get('sltab','pts'),n=+ls.get('sln',25);const T=[['goals','Goals'],['pts','Points'],['shots','Shots'],['streaks','Streaks'],['hit','Hit rates']];
let h=`<div class="filters">${T.map(([v,l])=>`<a class="pill" style="${v===t?'background:var(--a);color:#000':''}" onclick="ls.set('sltab','${v}');ls.set('sln',25);route()">${l}</a>`).join('')}</div>`;
const more=L=>L.length>n?`<div style="text-align:center;margin-top:8px"><a class="pill" onclick="ls.set('sln',${n+25});route()">Show more (${L.length-n} left)</a></div>`:'';
if(t==='goals'||t==='pts'||t==='shots'){const k={goals:'pG',pts:'pP',shots:'p3S'}[t],lab={goals:'to score',pts:'for a point',shots:'3+ shots'}[t];const L=[...R].sort((a,b)=>b[k]-a[k]);
 const E=[];if(t!=='shots')R.forEach(r=>{const b=k==='pG'?r.bG:r.bP,e=k==='pG'?r.eG:r.eP;if(b&&e>=.03)E.push(r)});E.sort((a,b)=>(k==='pG'?b.eG-a.eG:b.eP-a.eP));
 if(E.length)h+=`<h3>Edge highlights</h3>${E.slice(0,8).map(r=>cand(r,k,lab)).join('')}`;
 const hasLine=r=>k==='pG'?!!r.bG:k==='pP'?!!r.bP:!!(window.slipHas&&slipHas(r,k)),LP=L.filter(hasLine),LN=L.filter(r=>!hasLine(r)),ex=r=>k==='p3S'?`xSOG ${f(r.xs,1)}`:'';
 const when=day===new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'})?'tonight':fmtD(day);
 h+=`<h3>Most likely ${when} · priced</h3>${LP.slice(0,n).map(r=>cand(r,k,lab,ex(r))).join('')||'<p class="small m">No book prices posted yet for this list.</p>'}`;
 const nn=Math.max(10,n-LP.length);if(nn&&LN.length)h+=`<h3 style="color:var(--m,#8b97b0)">Projections · no line yet</h3><div class="np">${LN.slice(0,nn).map(r=>cand(r,k,lab,ex(r))).join('')}</div>`;
 h+=more(L)}
else if(t==='streaks'){const ids=new Set(R.map(r=>r.pid)),H=(D.hot?.rows||D.hot||[]).filter(x=>ids.has(x.pid)&&x.ptStreak>=2).sort((a,b)=>b.ptStreak-a.ptStreak);
 h+=H.slice(0,n).map(x=>{const r=R.find(y=>y.pid===x.pid);return `<div>${starBtn(x.pid)}${pl(x.pid,x.name)} <span class="m small">${x.team} · ${r.home?'vs':'@'} ${r.opp} · ${pc(r.pP)} for a point</span> <b class="g" style="float:right">${x.ptStreak}-gm pt streak${x.gStreak>=2?' · '+x.gStreak+'G':''}</b>${res(r,'pP')}</div>`}).join('')||'<span class="m small">No active streaks on this slate.</span>';h+=more(H)}
else{const S=LIVE.stats||{},done=R.filter(r=>S[r.pid]&&S[r.pid][3]===r.gid&&['OFF','FINAL'].includes((LIVE.games[r.gid]||D.games.find(g=>g.id===r.gid)||{}).state));
 const row=(k,lab,hit)=>[10,25].map(N=>{const L=[...done].sort((a,b)=>b[k]-a[k]).slice(0,N);if(!L.length)return'';const w=L.filter(r=>hit(S[r.pid])).length,ex=L.reduce((s,r)=>s+r[k],0);return `<tr><td class="l">${lab} · top ${N}</td><td><b>${w}/${L.length}</b></td><td>${Math.round(100*w/L.length)}%</td><td class="m">${Math.round(100*ex/L.length)}%</td></tr>`}).join('');
 h+=done.length?`<table><thead><tr><th class="l">List</th><th>Hit</th><th>Rate</th><th>Our avg %</th></tr></thead><tbody>${row('pG','Goals',x=>x[0]>0)}${row('pP','Points',x=>x[0]+x[1]>0)}${row('p3S','3+ shots',x=>x[2]>=3)}</tbody></table><p class="small m">${done.length} players with finished games.</p>`:'<span class="m small">Hit rates appear once games on this day are final.</span>'}
return h}
function bk(r,k){const b=k==="pG"?r.bG:k==="pP"?r.bP:null;if(!b)return"";const e=r[k]-b.nv,a=b.price>0?"+"+b.price:b.price;return `<div class="small m">book ${pc(b.nv)} (${a})</div>${e>=.03?`<span class="pill edge">+${Math.round(e*100)} edge</span>`:""}`}
function cand(r,k,lab,extra=''){return `<div class="cand"><img loading="lazy" src="https://assets.nhle.com/mugs/nhl/latest/${r.pid}.png" onerror="this.style.visibility='hidden'" alt="">
<div style="min-width:0"><b>${pl(r.pid,r.name)}</b> <span class="m small">${r.team} ${r.pos} · ${r.home?'vs':'@'} ${r.opp}</span>${(r.h2hNotes||[]).map(n=>`<span class="pill ${KL[n.kind][1]}">${KL[n.kind][0]}</span>`).join('')}${r.backup?'<span class="pill bk">vs backup</span>':''}
${(r.locked||(LIVE.stats||{})[r.pid]?.[3]===r.gid)?"":r.chips?`<div class="chips">${r.chips.map(c=>`<span>${esc(c)}</span>`).join('')}${extra?`<span>${extra}</span>`:''}</div>`:`<ul class="why">${(r.why||[]).slice(0,3).map(w=>`<li>${esc(sanitizeWhy(w))}</li>`).join('')}${extra?`<li>${extra}</li>`:''}</ul>`}</div><div class="pct">${pc(r[k])}<div class="small m">${lab}</div>${res(r,k)}${bk(r,k)}${window.slipBtn?slipBtn(r,k):""}${FM()?(()=>{const wk=FX().weeks.find(w=>w.start<=r.date&&r.date<=w.end),q=wk&&FX().sk[r.pid]?.w[wk.key];return q?`<div class="small y">~${f(fsk(q.c)/q.n,1)} FP/gm</div>`:''})():''}</div></div>`}
function notable(R){const L=R.filter(r=>r.h2hNotes&&r.h2hNotes.length),B=R.filter(r=>r.backup&&r.pG>.3);let h='';
h+=`<b class="y">H2H spots on this slate</b>`+(L.length?L.slice(0,14).map(r=>r.h2hNotes.map(n=>`<div class="small" style="margin:3px 0"><span class="pill ${KL[n.kind][1]}">${KL[n.kind][0]}</span> ${pl(r.pid,r.name)} ${r.home?'vs':'@'} ${r.opp}: ${esc(n.text.split(': ').slice(1).join(': '))}</div>`).join('')).join(''):'<div class="small m">None on this slate.</div>');
h+=`<br><b class="r">Shooters facing a projected backup/alternate</b>`+(B.length?B.slice(0,10).map(r=>`<div class="small">${pl(r.pid,r.name)} vs ${r.goalie} — ${pc(r.pG)} to score</div>`).join(''):'<div class="small m">None.</div>');return h}

function schedule(){const t=ls.get('steam','NSH'),only=ls.get('sonly','all');const A=Object.keys(D.teams).sort();
const gs=D.games.filter(g=>(t==='ALL'||g.home===t||g.away===t)&&(only==='all'||(only==='done'?g.hs!=null:g.hs==null)));
const rows=gs.map(g=>{const fin=g.hs!=null;let res='';if(t!=='ALL'&&fin){const me=g.home===t,gf=me?g.hs:g.as_,ga=me?g.as_:g.hs;res=`<span class="${gf>ga?'g':'r'}">${gf>ga?'W':(g.end&&g.end!=='REG'?'OTL':'L')} ${gf}-${ga}${g.end&&g.end!=='REG'?' '+g.end:''}</span>`}else if(fin)res=`${g.as_}-${g.hs}${g.end&&g.end!=='REG'?' '+g.end:''}`;

return `<h2>Hottest Players</h2><div class="filters"><select onchange="ls.set('hwin',this.value);route()"><option value="l5"${win==='l5'?' selected':''}>Last 5 games</option><option value="l10"${win==='l10'?' selected':''}>Last 10 games</option></select>

</div>${roles(H)}
<div class="card"><h3>Hottest vs baseline (ranked)</h3>${tbl(['Player','Team','Pos','P (per gm)','Base P','G (per gm)','Base G','SOG/gm','Base SOG','PPP','Pt strk','TOI','TOI Δ',...(FM()?['FP/gm*']:[])],(FM()?[...H].sort((a,b)=>hotFP(b[win])/b[win].n-hotFP(a[win])/a[win].n):H).slice(0,150).map(r))+(FM()?'<p class="small m">*Fantasy mode: FP/gm over the window uses G, A, PPP and SOG only. Per-game hits, blocks and SHP aren\'t in the free game logs.</p>':'')}</div>`}

const ESPN_AB={"LAK":"LA","NJD":"NJ","SJS":"SJ","TBL":"TB","UTA":"UTAH","MTL":"MTL"};
const AB_ESPN=Object.fromEntries(Object.entries(ESPN_AB).map(([a,b])=>[b,a]));
const LIVE={games:{},goalies:{},recaps:{},ts:0};
async function pullLive(){
  try{
    const [espn,live]=await Promise.all([
      fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard').then(r=>r.json()).catch(()=>null),
      fetch('https://raw.githubusercontent.com/mkuritz/nhl-lab/live/live.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(live){live.games.forEach(g=>LIVE.games[g.id]=Object.assign(LIVE.games[g.id]||{},g));(live.goalies||[]).forEach(g=>LIVE.goalies[g.gid+'-'+g.team]=g);LIVE.src=live.updatedET;LIVE.stats=live.stats||{}}
    if(espn){(espn.events||[]).forEach(e=>{const c=e.competitions[0],away=c.competitors.find(x=>x.homeAway==='away'),home=c.competitors.find(x=>x.homeAway==='home');
      const aAb=AB_ESPN[away.team.abbreviation]||away.team.abbreviation,hAb=AB_ESPN[home.team.abbreviation]||home.team.abbreviation;
      const g=D.games.find(x=>x.date===(espn.day?.date||LIVE.date||'')&&x.away===aAb&&x.home===hAb)||D.games.find(x=>x.away===aAb&&x.home===hAb&&(x.state==='FUT'||x.state==='PRE'||x.state==='LIVE'||x.state==='CRIT'||!x.end));
      if(!g)return;const st=e.status.type;const state=st.completed?'OFF':st.state==='in'?'LIVE':st.state==='pre'?'FUT':g.state;
      LIVE.games[g.id]=Object.assign(LIVE.games[g.id]||{},{id:g.id,state,as_:+away.score||0,hs:+home.score||0,period:c.status?.period,clock:c.status?.displayClock,detail:st.detail||st.description});
    })}
    LIVE.ts=Date.now();
  }catch(e){console.warn('live',e)}
}
function liveG(g){return Object.assign({},g,LIVE.games[g.id]||{})}
function gStatus(x){const L=LIVE.goalies[x.gid+'-'+x.team];if(L)return L;return x}
