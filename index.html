<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHL Lab</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏒</text></svg>"><meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#0b1020;--p:#131a2e;--p2:#1a2340;--b:#26304f;--t:#e6ebff;--m:#8d97b8;--a:#4fc3ff;--g:#3ddc97;--r:#ff6b7a;--y:#ffc857;--v:#b28dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--a);text-decoration:none;cursor:pointer}header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--b)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}.logo{font-weight:800;font-size:18px;letter-spacing:.3px}.logo span{color:var(--a)}
.badge{margin-left:auto;font-size:12px;color:var(--m);background:var(--p);border:1px solid var(--b);padding:4px 10px;border-radius:99px;white-space:nowrap}
aside{position:fixed;top:53px;left:0;bottom:0;width:220px;overflow-y:auto;background:#0d1326;border-right:1px solid var(--b);padding:10px 8px;z-index:4}
nav a{display:block;color:var(--m);padding:8px 12px;border-radius:8px;font-weight:600}nav a.on,nav a:hover{background:var(--p2);color:var(--t)}
nav .tl{display:none;padding-left:8px}nav .tl.open{display:block}nav .tl a{padding:4px 10px;font-weight:500;font-size:13px}nav .sec{font-size:11px;color:#5d678a;text-transform:uppercase;letter-spacing:.08em;padding:12px 12px 4px}
.mb{display:none;background:none;border:0;color:var(--t);font-size:22px;cursor:pointer}#scrim{display:none}
main{margin-left:220px}
@media(max-width:860px){aside{transform:translateX(-100%);transition:transform .2s}body.navopen aside{transform:none}.mb{display:block}main{margin-left:0}body.navopen #scrim{display:block;position:fixed;inset:0;background:#0008;z-index:3}}
main{max-width:1240px;padding:16px}h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}
th{color:var(--m);font-weight:600;position:sticky;top:0;background:var(--p);cursor:pointer;user-select:none}td:first-child,th:first-child,.l{text-align:left}
.tw{overflow-x:auto;max-height:70vh}tr:hover td{background:var(--p2)}
.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.small{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--p2);border:1px solid var(--b);margin:1px 2px}
.pill.leg{background:#3a2a05;border-color:#7a5a10;color:var(--y)}.pill.bk{background:#3a0f18;border-color:#7a1f30;color:var(--r)}.pill.b2b{background:#1d1640;border-color:#46399a;color:var(--v)}
input,select{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:7px 10px;font:inherit}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:6px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}
.cand{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--b)}.cand img{width:44px;height:44px;border-radius:50%;background:var(--p2)}
.cand .pct{margin-left:auto;text-align:right;font-weight:800;font-size:18px}.why{margin:4px 0 0;padding-left:16px;color:var(--m);font-size:12px}
.hero{display:flex;gap:14px;align-items:center}.hero>img{width:84px;height:84px;border-radius:50%;background:var(--p2)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.kv div{background:var(--p2);border-radius:8px;padding:8px}.kv b{display:block;font-size:17px}
.note{background:#10203a;border:1px solid #1f3f6a;border-radius:10px;padding:10px;font-size:12px;color:#b8cdf0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}.tabs a{padding:7px 12px;border-radius:8px;background:var(--p);border:1px solid var(--b);color:var(--m);font-weight:600;white-space:nowrap}.tabs a.on{background:var(--a);color:#000}
.gS,.gE{color:var(--g);font-weight:700}.gW,.gT{color:var(--r);font-weight:700}.gN{color:var(--m)}.star{cursor:pointer;color:var(--y);font-size:18px;background:none;border:0}
.tlogo{width:20px;height:20px;vertical-align:middle;margin-right:4px}
@media(max-width:640px){main{padding:10px}th,td{padding:6px 5px}.hide-m{display:none}}
</style></head><body>
<header><div class="top"><button id="mb" class="mb" onclick="document.body.classList.toggle('navopen')" aria-label="Menu">☰</button><div class="logo">NHL <span>Lab</span></div><div class="badge" id="badge">Loading…</div></div></header>
<aside id="side"><nav id="nav"></nav></aside><div id="scrim" onclick="document.body.classList.remove('navopen')"></div><main id="app"><div class="card">Loading data…</div></main>
<script>
const LS='nhllab:',V=[['slate','Daily Slate'],['hot','Hot List'],['watch','★ Watchlist'],['matchups','Matchups'],['teams','Teams'],['players','Players'],['lines','Lines'],['news','News'],['war','WAR'],['h2h','H2H Flags'],['goalies','Goalies'],['schedule','Schedule'],['method','Methodology']];
const D={},$=s=>document.querySelector(s),pc=x=>x==null?'–':(x*100).toFixed(0)+'%',f=(x,n=2)=>x==null?'–':(+x).toFixed(n),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v))};
const logo=a=>D.teams[a]?`<img class="tlogo" src="${D.teams[a].logo}" alt="">`:'';
const pl=(id,n)=>`<a href="#player/${id}">${esc(n)}</a>`,tm=a=>`<a href="#team/${a}">${logo(a)}${a}</a>`;
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
async function J(u){const r=await fetch(u+'?v='+(D.meta?.updated||Date.now()));if(!r.ok)throw Error(u);return r.json()}
function sortable(el){el.querySelectorAll('table').forEach(t=>{t.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{const b=t.tBodies[0],rs=[...b.rows],asc=th.dataset.s!=='a';th.dataset.s=asc?'a':'d';
rs.sort((x,y)=>{const a=x.cells[i].dataset.v??x.cells[i].innerText,c=y.cells[i].dataset.v??y.cells[i].innerText,na=parseFloat(a),nc=parseFloat(c);const r=isNaN(na)||isNaN(nc)?a.localeCompare(c):na-nc;return asc?-r:r});rs.forEach(r=>b.appendChild(r))})})}
function tbl(h,rows){return `<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const td=(v,s)=>`<td${s!=null?` data-v="${s}"`:''}>${v}</td>`;

function slate(){const s=D.slate,days=s.days;let day=ls.get('day',days[0]);if(!days.includes(day))day=days[0];
const gs=D.games.filter(g=>g.date===day),rows=s.rows.filter(r=>r.date===day);const pos=ls.get('slpos','all');
const R=rows.filter(r=>pos==='all'||(pos==='D'?r.pos==='D':r.pos!=='D'));
const gq=s.goalies.filter(g=>g.date===day);
let h=`<h2>Daily Slate</h2><div class="filters">${days.map(d=>`<a class="pill" style="${d===day?'background:var(--a);color:#000':''}" onclick="ls.set('day','${d}');route()">${fmtD(d)}</a>`).join('')}
<select onchange="ls.set('slpos',this.value);route()">${[['all','All skaters'],['F','Forwards'],['D','Defense']].map(([v,l])=>`<option value="${v}"${v===pos?' selected':''}>${l}</option>`).join('')}</select></div>
<div class="grid"><div class="card" style="grid-column:1/-1"><h3>Games (${gs.length})</h3><div class="grid">${gs.map(g=>{const ga=gq.find(x=>x.gid===g.id&&x.team===g.away),gh=gq.find(x=>x.gid===g.id&&x.team===g.home);
const gl=x=>x?`${x.gid_?pl(x.gid_,x.goalie):'?'} <span class="m">${f(x.sv,3)}</span>${x.backup?' <span class="pill bk">BACKUP/ALT</span>':''}`:'–';
return `<div><b>${tm(g.away)} @ ${tm(g.home)}</b> <span class="m">${g.time} ET</span> ${g.aB2B?'<span class="pill b2b">'+g.away+' B2B</span>':''}${g.hB2B?'<span class="pill b2b">'+g.home+' B2B</span>':''}
<div class="small m">${g.hs!=null?`${g.state==='OFF'||g.state==='FINAL'?'Final':'Live'}: ${g.away} ${g.as_} – ${g.home} ${g.hs}`:g.state==='FUT'||g.state==='PRE'?`Proj. goalies (heuristic): ${gl(ga)} vs ${gl(gh)}`:'In progress'}</div></div>`}).join('')||'<span class="m">No games.</span>'}</div>
<p class="small m">Goalies are <b>projected</b> from recent starts, back-to-backs and ESPN injury status — not confirmed lineups. Check team news before puck drop.</p></div>
<div class="card"><h3>Top goal-scorer candidates</h3>${R.slice(0,25).map(r=>cand(r,'pG','to score')).join('')}</div>
<div class="card"><h3>Top point candidates</h3>${[...R].sort((a,b)=>b.pP-a.pP).slice(0,25).map(r=>cand(r,'pP','for a point')).join('')}</div>
<div class="card"><h3>Shot volume (P 3+ SOG)</h3>${[...R].sort((a,b)=>b.p3S-a.p3S).slice(0,20).map(r=>cand(r,'p3S','3+ shots',`xSOG ${f(r.xs,1)}`)).join('')}</div>
<div class="card"><h3>Notable spots</h3>${notable(R)}</div></div>`;return h}
function cand(r,k,lab,extra=''){return `<div class="cand"><img loading="lazy" src="https://assets.nhle.com/mugs/nhl/latest/${r.pid}.png" onerror="this.style.visibility='hidden'" alt="">
<div style="min-width:0"><b>${pl(r.pid,r.name)}</b> <span class="m small">${r.team} ${r.pos} · ${r.home?'vs':'@'} ${r.opp}</span>${r.legend?'<span class="pill leg">LEGENDARY H2H</span>':''}${r.backup?'<span class="pill bk">vs backup</span>':''}
<ul class="why">${(r.why||[]).slice(0,3).map(w=>`<li>${esc(w)}</li>`).join('')}${extra?`<li>${extra}</li>`:''}</ul></div><div class="pct">${pc(r[k])}<div class="small m">${lab}</div></div></div>`}
function notable(R){const L=R.filter(r=>r.legend),B=R.filter(r=>r.backup&&r.pG>.3);let h='';
h+=`<b class="y">Legendary H2H tonight</b>`+(L.length?L.slice(0,10).map(r=>`<div class="small">${pl(r.pid,r.name)}: ${esc(r.legend[0])}</div>`).join(''):'<div class="small m">None on this slate.</div>');
h+=`<br><b class="r">Shooters facing a projected backup/alternate</b>`+(B.length?B.slice(0,10).map(r=>`<div class="small">${pl(r.pid,r.name)} vs ${r.goalie} — ${pc(r.pG)} to score</div>`).join(''):'<div class="small m">None.</div>');return h}

function schedule(){const t=ls.get('steam','NSH'),only=ls.get('sonly','all');const A=Object.keys(D.teams).sort();
const gs=D.games.filter(g=>(t==='ALL'||g.home===t||g.away===t)&&(only==='all'||(only==='done'?g.hs!=null:g.hs==null)));
const rows=gs.map(g=>{const fin=g.hs!=null;let res='';if(t!=='ALL'&&fin){const me=g.home===t,gf=me?g.hs:g.as_,ga=me?g.as_:g.hs;res=`<span class="${gf>ga?'g':'r'}">${gf>ga?'W':(g.end&&g.end!=='REG'?'OTL':'L')} ${gf}-${ga}${g.end&&g.end!=='REG'?' '+g.end:''}</span>`}else if(fin)res=`${g.as_}-${g.hs}${g.end&&g.end!=='REG'?' '+g.end:''}`;
const me=t==='ALL'?null:(g.home===t?'h':'a');const rest=me?g[me+'Rest']:null;
return `<tr>${td(fmtD(g.date),g.date)}${td(t==='ALL'?`${tm(g.away)} @ ${tm(g.home)}`:(me==='h'?'vs ':'@ ')+tm(me==='h'?g.away:g.home))}${td(t==='ALL'?'':me==='h'?'Home':'Away')}${td(res||`<span class="m">${g.time} ET</span>`)}${td(rest==null?'–':rest)}${td((g.aB2B?`<span class="pill b2b">${g.away} B2B</span>`:'')+(g.hB2B?`<span class="pill b2b">${g.home} B2B</span>`:''))}</tr>`});
return `<h2>Schedule</h2><div class="filters"><select onchange="ls.set('steam',this.value);route()"><option value="ALL">All teams</option>${A.map(a=>`<option${a===t?' selected':''}>${a}</option>`).join('')}</select>
<select onchange="ls.set('sonly',this.value);route()">${[['all','Full season'],['done','Results'],['up','Upcoming']].map(([v,l])=>`<option value="${v}"${v===only?' selected':''}>${l}</option>`).join('')}</select></div>
<div class="card">${t!=='ALL'?`<p class="small m">${D.teams[t].name}: ${D.teams[t].b2b} back-to-backs this season. Rest = days off before the game.</p>`:''}${tbl(['Date','Matchup','H/A','Result','Rest','B2B'],rows)}</div>`}

function teams(){const T=Object.values(D.teams).sort((a,b)=>a.leagueRank-b.leagueRank);
return `<h2>Teams & Standings</h2><div class="card">${tbl(['Team','GP','W-L-OTL','PTS','P%','GF/G','GA/G','Diff','PP%','PK%','SF/G','SA/G','Home','Road','L10','Strk'],T.map(t=>{const c=t.cur||{};return `<tr>${td(tm(t.abbrev),t.abbrev)}${td(t.gp)}${td(`${t.w}-${t.l}-${t.otl}`,t.w)}${td('<b>'+t.pts+'</b>',t.pts)}${td(f(t.ptsPct,3))}${td(f(c.gfpg))}${td(f(c.gapg))}${td(`<span class="${t.diff>=0?'g':'r'}">${t.diff>0?'+':''}${t.diff}</span>`,t.diff)}${td(pc(c.pp))}${td(pc(c.pk))}${td(f(c.sfpg,1))}${td(f(c.sapg,1))}${td(t.home)}${td(t.road)}${td(t.l10)}${td(t.streak)}</tr>`}))}
<p class="small m">Early-season team rates are small samples (${T[0].gp||0} GP). Projections blend them with last season's rates.</p></div>`}
function teamOld(a){const t=D.teams[a];if(!t)return '<div class="card">Unknown team</div>';const c=t.cur||{},p=t.prev||{},s=t.splits;const P=D.players.filter(x=>x.team===a);
const gq=D.goalies[a];const up=D.games.filter(g=>(g.home===a||g.away===a)&&g.hs==null).slice(0,8);
return `<div class="card hero"><img src="${t.logo}" alt=""><div><h2 style="margin:0">${t.name}</h2><div class="m">${t.div} · ${t.w}-${t.l}-${t.otl}, ${t.pts} pts · Streak ${t.streak} · L10 ${t.l10}</div></div></div>
<div class="grid"><div class="card"><h3>Team rates</h3>${tbl(['','This season','Last season'],[['GF/G','gfpg'],['GA/G','gapg'],['SF/G','sfpg'],['SA/G','sapg'],['PP%','pp'],['PK%','pk']].map(([l,k])=>`<tr><td>${l}</td><td>${k.length==2?pc(c[k]):f(c[k])}</td><td>${k.length==2?pc(p[k]):f(p[k])}</td></tr>`))}
<p class="small m">Home ${s.H.gp} GP: ${f(s.H.gfpg)} GF / ${f(s.H.gapg)} GA · Road ${s.R.gp} GP: ${f(s.R.gfpg)} GF / ${f(s.R.gapg)} GA</p></div>
<div class="card"><h3>Goalies</h3>${gq.order.map(g=>`<div>${pl(g.id,g.name)} <span class="m">${g.starts} GS · shrunk SV% ${f(g.sv,3)}</span>${g.out?` <span class="pill bk">${esc(g.inj.status)}</span>`:''}</div>`).join('')}<p class="small m">Starter-backup gap: ${gq.gap==null?'–':f(gq.gap,3)}</p></div>
<div class="card"><h3>Next games</h3>${up.map(g=>`<div>${fmtD(g.date)} ${g.home===a?'vs':'@'} ${tm(g.home===a?g.away:g.home)} ${(g.home===a?g.hB2B:g.aB2B)?'<span class="pill b2b">B2B</span>':''}</div>`).join('')}<p><a href="#schedule" onclick="ls.set('steam','${a}')">Full schedule →</a></p></div></div>
<div class="card"><h3>Roster</h3>${skTable(P.filter(x=>x.pos!=='G'))}</div>`}

function skTable(P,which='cur'){return tbl(['Player','Pos','GP','G','A','P','+/-','SOG','PPP','TOI','CF%','FF%','WAR','Proj G','Proj P'],P.map(x=>{const c=x[which]||{},w=which==='cur'?x.war:x.warPrev;return `<tr>${td(pl(x.id,x.name)+(x.inj?' <span class="pill bk">'+esc(x.inj.status)+'</span>':'')+' <span class="m small">'+x.team+'</span>',x.name)}${td(x.pos)}${td(c.gp??0)}${td(c.g??0)}${td(c.a??0)}${td('<b>'+(c.p??0)+'</b>',c.p??0)}${td(c.pm??'–')}${td(c.s??0)}${td(c.ppp??0)}${td(f(c.toi,1))}${td(pc(c.cf),c.cf)}${td(pc(c.ff),c.ff)}${td(f(w?.war),w?.war??-99)}${td(f(x.proj?.G,1),x.proj?.G)}${td(f(x.proj?.P,1),x.proj?.P)}</tr>`}))}
function players(){const q=ls.get('pq',''),t=ls.get('pt','ALL'),ps=ls.get('ppos','sk'),se=ls.get('pse','cur');const A=Object.keys(D.teams).sort();
let P=D.players.filter(x=>(t==='ALL'||x.team===t)&&(!q||x.name.toLowerCase().includes(q.toLowerCase())));
const G=ps==='G';P=P.filter(x=>G?x.pos==='G':ps==='D'?x.pos==='D':ps==='F'?(x.pos!=='D'&&x.pos!=='G'):x.pos!=='G');
P.sort((a,b)=>G?((b[se]?.gp||0)-(a[se]?.gp||0)):((b[se]?.p||0)-(a[se]?.p||0)));
return `<h2>Players</h2><div class="filters"><input placeholder="Search player" value="${esc(q)}" oninput="ls.set('pq',this.value);clearTimeout(window._t);window._t=setTimeout(()=>{route();const i=document.querySelector('input');i.focus();i.setSelectionRange(99,99)},250)">
<select onchange="ls.set('pt',this.value);route()"><option value="ALL">All teams</option>${A.map(a=>`<option${a===t?' selected':''}>${a}</option>`).join('')}</select>
<select onchange="ls.set('ppos',this.value);route()">${[['sk','Skaters'],['F','Forwards'],['D','Defense'],['G','Goalies']].map(([v,l])=>`<option value="${v}"${v===ps?' selected':''}>${l}</option>`).join('')}</select>
<select onchange="ls.set('pse',this.value);route()"><option value="cur"${se==='cur'?' selected':''}>${D.model.season.toString().replace(/(\d{4})(\d{4})/,'$1-$2')}</option><option value="prev"${se==='prev'?' selected':''}>${D.model.prev.toString().replace(/(\d{4})(\d{4})/,'$1-$2')}</option></select></div>
<div class="card">${G?gTable(P,se):skTable(P.slice(0,400),se)}<p class="small m">Click a column to sort. CF%/FF% are NHL on-ice 5v5 shot-attempt shares. Proj = season-end projection.</p></div>`}
function gTable(P,se){return tbl(['Goalie','Team','GP','GS','W-L-OTL','GAA','SV%','SA','SO','GSAA','WAR'],P.map(x=>{const c=x[se]||{},w=se==='cur'?x.war:x.warPrev;return `<tr>${td(pl(x.id,x.name)+(x.inj?' <span class="pill bk">'+esc(x.inj.status)+'</span>':''),x.name)}${td(x.team)}${td(c.gp??0)}${td(c.gs??0)}${td(c.w!=null?`${c.w}-${c.l}-${c.otl}`:'–',c.w)}${td(f(c.gaa))}${td(f(c.sv,3))}${td(c.sa??0)}${td(c.so??0)}${td(f(w?.gsaa,1),w?.gsaa??-99)}${td(f(w?.war),w?.war??-99)}</tr>`}))}

function war(){const se=ls.get('wse','prev');const k=se==='cur'?'war':'warPrev';const P=D.players.filter(x=>x[k]&&x[k].gp>0).sort((a,b)=>b[k].war-a[k].war);
return `<h2>Wins Above Replacement (approx.)</h2><div class="filters"><select onchange="ls.set('wse',this.value);route()"><option value="cur"${se==='cur'?' selected':''}>This season</option><option value="prev"${se==='prev'?' selected':''}>Last season (full)</option></select> <a href="#method" class="pill">How it's built</a></div>
<div class="card">${tbl(['Player','Team','Pos','GP','EV GAR','PP GAR','Poss GAR','GSAA (G)','GAR','WAR','WAR/82'],P.slice(0,300).map(x=>{const w=x[k];return `<tr>${td(pl(x.id,x.name),x.name)}${td(x.team)}${td(x.pos)}${td(w.gp)}${td(f(w.ev,1),w.ev??-99)}${td(f(w.pp,1),w.pp??-99)}${td(f(w.poss,1),w.poss??-99)}${td(f(w.gsaa,1),w.gsaa??-99)}${td(f(w.gar,1),w.gar)}${td('<b>'+f(w.war)+'</b>',w.war)}${td(x.pos==='G'?'–':f(w.war/w.gp*82),x.pos==='G'?-99:w.war/w.gp*82)}</tr>`}))}
<p class="small m">An offense-weighted approximation built from public NHL box-score stats, not a clone of Evolving-Hockey or similar models. Magnitudes for top scorers run higher than those models because there's no defensive or penalty component beyond a shot-attempt proxy. Use it to rank players, not as a precise value. Early-season values are tiny samples.</p></div>`}

function method(){const m=D.model,r=m.repl[m.prev]||{},rc=m.repl[m.season]||{};return `<h2>Methodology</h2>
<div class="card"><h3>Data & refresh</h3><p>Every number comes from free public feeds: NHL's api-web.nhle.com (schedules, rosters, game logs, standings), api.nhle.com/stats (season stats, TOI, 5v5 shot attempts), and ESPN's NHL injury report. GitHub Actions does a full rebuild at about 2:30 AM ET (after late games) and 7:00 AM ET, plus targeted rebuilds of just the teams playing about 90 and 30 minutes before each puck drop. It can also be run by hand. Past-season game logs are cached, and the current season is refetched every run.</p></div>
<div class="card"><h3>WAR (Goals/Wins Above Replacement): approximation</h3>
<p><b>Replacement level</b> is the per-60 production of skaters outside the top 416 forwards (13 per team) or top 224 defensemen (7 per team) by total ice time, with at least 5 GP. For goalies, it's the shots-weighted SV% of goalies outside the top 64 by shots faced, capped at league average −0.004.</p>
<ul><li><b>EV offense GAR</b> = (EV goals + 0.5 × EV assists) − replacement rate × EV hours. Last season's replacement rates: F ${f(r.F_ev60,3)}/60, D ${f(r.D_ev60,3)}/60.</li>
<li><b>PP GAR</b> = the same formula on the power play (replacement F ${f(r.F_pp60,3)}, D ${f(r.D_pp60,3)} per 60 PP).</li>
<li><b>Possession/defense proxy</b> = (5v5 Corsi relative − replacement CF rel) × 110 attempts/60 × 5v5 hours × 0.045 goals/attempt × 50% credit.</li>
<li><b>Goalies</b>: GAR = (SV% − replacement SV%) × shots against. GSAA (vs league average ${f(m.leagueSVprev,3)} last season) is shown separately. It isn't adjusted for shot quality (no xG), because computing xG from every play-by-play event isn't built yet.</li>
<li><b>WAR = GAR ÷ ${m.goalsPerWin}</b> goals per win.</li></ul>
<p class="m small">Not included: penalties drawn/taken, faceoffs, shot quality, and a real defensive model. This season's replacement rates: F EV ${f(rc.F_ev60,3)}, goalie SV ${f(rc.goalie_sv,3)}.</p></div>
<div class="card"><h3>Game projections (Poisson model)</h3><ol>
<li><b>Player base rate</b> = (this season + ${m.wPrev} × last season + ${m.kShrink} phantom games at 60% of the positional mean) ÷ games. This gives goals, points and shots per game. Positional means last season: F ${f(m.posmean.F.g,3)} G/gm, D ${f(m.posmean.D.g,3)} G/gm.</li>
<li><b>Goal environment</b> = 60% opposing goalie factor ((1 − his shrunk SV%) ÷ (1 − league SV%), clamped 0.75–1.30) + 40% opponent GA/game factor. GA/game blends this season, 35% of last season, and 10 games of league average (${f(m.lgGA,2)}).</li>
<li><b>Context</b>: home ×1.03, road ×0.97, own back-to-back ×0.94, opponent on a back-to-back ×1.04, and a PP adjustment scaled by the player's PP share of points against the opponent's PK% (league ${pc(m.lgPK)}).</li>
<li>λ<sub>goals</sub> = rate × all factors, and P(score) = 1 − e<sup>−λ</sup>. Points use half the goal-environment swing. Shots use the opponent's shots-allowed factor, and P(3+ SOG) is a Poisson tail.</li>
<li><b>Goalie</b>: the projected starter is the healthy goalie with the most starts. On the second night of a back-to-back, the No. 2 is projected. If ESPN lists the No. 1 as Out, IR or Day-To-Day, the next goalie is used. This is a heuristic, not a confirmed lineup.</li>
<li><b>Season projection</b> = current totals + the sum of λ over every remaining game. It assumes the player stays healthy and in his role.</li></ol>
<p class="small m">Legendary H2H flags appear as notes and do not change λ (H2H samples are noisy). Every probability is a model estimate, not a sportsbook line.</p></div>`}

return `<tr>${td((nextOpps.has(o)?'★ ':'')+(D.teams[o]?tm(o):o),o)}${td(a[0])}${td(a[1])}${td(a[2])}${td(a[3])}${td(`<span class="${rel>1.3?'g':rel<.7?'r':''}">${f(rate)}</span>`,rate)}${td(a[4])}${td(b[0]||'–',b[0])}${td(b[0]?b[1]:'–',b[1])}${td(b[0]?b[3]:'–',b[3])}${td(b[0]?f(b[3]/b[0]):'–',b[0]?b[3]/b[0]:-1)}${td(v.flags?'<span class="pill leg">LEGENDARY</span>':'',v.flags?1:0)}</tr>`}))}</div>`}
else{h+=`<div class="card"><h3>This season</h3><div class="kv"><div>GP<b>${c.gp??0}</b></div><div>GS<b>${c.gs??0}</b></div><div>Record<b>${c.w??0}-${c.l??0}-${c.otl??0}</b></div><div>GAA<b>${f(c.gaa)}</b></div><div>SV%<b>${f(c.sv,3)}</b></div><div>GSAA<b>${f(p.war?.gsaa,1)}</b></div><div>WAR<b>${f(p.war?.war)}</b></div></div></div>`}

tbl(['Season','Team','GP','G','A','P','+/-','SOG','PPG','PPP','TOI'],p.seasons.map(s=>`<tr>${td(String(s.season).replace(/(\d{4})(\d{2})\d{2}/,'$1-$2'),s.season)}${td(esc(s.team))}${td(s.gp)}${td(s.g)}${td(s.a)}${td('<b>'+s.p+'</b>',s.p)}${td(s.pm)}${td(s.s)}${td(s.ppg)}${td(s.ppp)}${td(s.toi||'–')}</tr>`))}</div>`;
const lg=[...(p.log||[])].reverse();h+=`<div class="card"><h3>Game log, this season</h3>${lg.length?(G?tbl(['Date','Opp','GS','SA','GA','SV%','Dec'],lg.map(r=>`<tr>${td(r[1])}${td((r[4]==='H'?'vs ':'@ ')+r[3])}${td(r[5])}${td(r[6])}${td(r[7])}${td(r[6]?f((r[6]-r[7])/r[6],3):'–')}${td(r[8]||'')}</tr>`)):

<div class="card"><h3>Easiest for goalies/defense</h3>${tbl(['Team','Off idx','Def idx','Home','B2B'],easyD.slice(0,10).map(row))}</div></div>

function team(a,tab='overview'){const t=D.teams[a];if(!t)return '<div class="card">Unknown team</div>';const X=D.teamx,sim=X.sim[a],c=t.cur||{},p=t.prev||{},s=t.splits;

<div><b>${t.w}-${t.l}-${t.otl}</b> · ${t.pts} pts · streak ${t.streak} · L10 ${t.l10} · Proj <b>${sim.mean}</b> pts · Playoff ${pc(sim.playoff)} <span class="m small">(est.)</span></div></div></div>
<div class="tabs">${T.map(([k,l])=>`<a href="#team/${a}/${k}" class="${k===tab?'on':''}">${l}</a>`).join('')}</div>`;
const FIN=g=>g.state==='OFF'||g.state==='FINAL';const up=D.games.filter(g=>(g.home===a||g.away===a)&&!FIN(g)&&g.hs==null);const done=D.games.filter(g=>(g.home===a||g.away===a)&&FIN(g));
if(tab==='overview'){const l10=done.slice(-10);h+=`<div class="grid"><div class="card"><h3>Team rates</h3>${tbl(['','This season','Last season','NHL rank'],[['GF/G','gfpg',1],['GA/G','gapg',0],['SF/G','sfpg',1],['SA/G','sapg',0],['PP%','pp',1],['PK%','pk',1]].map(([l,k,hi])=>{const v=Object.values(D.teams).map(x=>(x.cur||{})[k]).filter(x=>x!=null).sort((x,y)=>hi?y-x:x-y);const rk=c[k]!=null?v.indexOf(c[k])+1:'–';
return `<tr><td>${l}</td><td>${k.length==2?pc(c[k]):f(c[k])}</td><td>${k.length==2?pc(p[k]):f(p[k])}</td><td>${rk}</td></tr>`}))}<p class="small m">Home ${s.H.gp} GP: ${f(s.H.gfpg)} GF / ${f(s.H.gapg)} GA · Road ${s.R.gp} GP: ${f(s.R.gfpg)} GF / ${f(s.R.gapg)} GA · Goal diff ${t.diff>0?'+':''}${t.diff}</p></div>
<div class="card"><h3>Last ${l10.length} results</h3>${l10.map(g=>{const me=g.home===a,gf=me?g.hs:g.as_,ga=me?g.as_:g.hs;return `<div>${fmtD(g.date)} ${me?'vs':'@'} ${tm(me?g.away:g.home)} <b class="${gf>ga?'g':'r'}" style="float:right">${gf>ga?'W':'L'} ${gf}-${ga}${g.end&&g.end!=='REG'?' '+g.end:''}</b></div>`}).join('')||'<span class="m">None yet</span>'}</div>
<div class="card"><h3>${t.conf} standings</h3>${conf.map(x=>`<div style="${x.abbrev===a?'color:var(--a);font-weight:700':''}">${x.confRank}. ${tm(x.abbrev)} <span style="float:right">${x.pts} pts (${x.gp} GP)</span></div>`).join('')}</div>
<div class="card"><h3>Next 5 · SOS</h3>${up.slice(0,5).map(g=>{const gr=GR(g.id,a)||{};return `<div>${fmtD(g.date)} ${g.home===a?'vs':'@'} ${tm(g.home===a?g.away:g.home)} <span style="float:right">O ${gc(gr.og)} · D ${gc(gr.dg)}</span></div>`}).join('')}
<p class="small m">Next-5 offense index ${f(D.grades.sos[a]['5']?.off,3)}, defense index ${f(D.grades.sos[a]['5']?.dfn,3)} (1.00 = average)</p></div>
<div class="card"><h3>Leaders (this season)</h3>${['p','g','s'].map(k=>{const b=[...SK].sort((x,y)=>(y.cur?.[k]||0)-(x.cur?.[k]||0))[0];return b?`<div>${{p:'Points',g:'Goals',s:'Shots'}[k]}: ${pl(b.id,b.name)} <b style="float:right">${b.cur?.[k]??0}</b></div>`:''}).join('')}
${(()=>{const b=[...P].filter(x=>x.war).sort((x,y)=>y.war.war-x.war.war)[0];return b?`<div>WAR: ${pl(b.id,b.name)} <b style="float:right">${f(b.war.war)}</b></div>`:''})()}</div></div>`}
if(tab==='roster')h+=`<div class="card"><h3>Skaters</h3>${skTable(SK)}</div><div class="card"><h3>Goalies</h3>${gTable(GL,'cur')}</div><div class="note">Contract and cap data isn't included. There's no reliable free, publicly licensed source (sites like PuckPedia and CapWages are proprietary), so it's left out rather than guessed.</div>`;
if(tab==='news')h+=`<div class="card">${newsList(D.news.teams[a]||[],15)}</div>`;
if(tab==='lines'){const U=X.usage[a];h+=lineCard(a)+`<div class="card"><h3>Ice time & estimated PP units</h3>${tbl(['Player','Pos','GP','TOI','EV','PP','SH','Shifts','PP unit (est.)'],U.map(x=>`<tr>${td(pl(x.pid,x.name),x.name)}${td(x.pos)}${td(x.gp)}${td(f(x.toi,1))}${td(f(x.ev,1))}${td(f(x.pp,1))}${td(f(x.sh,1))}${td(f(x.shifts,1))}${td(x.ppUnit?`<span class="pill">${x.ppUnit}</span>`:'')}</tr>`))}
<p class="small m">PP units are <b>estimated</b> by ranking PP ice time per game: top 5 = PP1, next 5 = PP2. Real line combinations aren't published in the free feeds. Penalty-kill units can be read from the SH column.</p></div>`}
if(tab==='goalies'){const gq=D.goalies[a];h+=`<div class="card"><h3>Starter / backup</h3>${tbl(['Goalie','GS (season)','GS last season','Shrunk SV%','Status'],gq.order.map(g=>`<tr>${td(pl(g.id,g.name))}${td(g.starts)}${td(g.prevStarts)}${td(f(g.sv,3))}${td(g.inj?`<span class="r">${esc(g.inj.status)}</span>`:'Healthy')}</tr>`))}
<p class="small m">Starter-backup SV% gap: ${f(gq.gap,3)}. Projected starters for upcoming games: ${D.slate.goalies.filter(x=>x.team===a).map(x=>`${fmtD(x.date)}: ${esc(x.goalie)}${x.backup?' (alt)':''}`).join(' · ')||'–'}</p></div>${gTable(GL,'prev')?`<div class="card"><h3>Last season</h3>${gTable(GL,'prev')}</div>`:''}`}
if(tab==='schedule'){const ss=D.grades.sos[a];h+=`<div class="card"><p class="small m">SOS next 5: off ${f(ss['5']?.off,3)} / def ${f(ss['5']?.dfn,3)} · next 10: off ${f(ss['10']?.off,3)} / def ${f(ss['10']?.dfn,3)} · ${t.b2b} back-to-backs this season</p>
${tbl(['Date','Opp','H/A','Result','Rest','B2B','Off grade','Def grade'],D.games.filter(g=>g.home===a||g.away===a).map(g=>{const me=g.home===a?'h':'a',gf=me==='h'?g.hs:g.as_,ga=me==='h'?g.as_:g.hs,gr=GR(g.id,a)||{};
return `<tr>${td(fmtD(g.date),g.date)}${td(tm(me==='h'?g.away:g.home))}${td(me==='h'?'Home':'Away')}${td(g.hs!=null?`<span class="${gf>ga?'g':'r'}">${gf>ga?'W':'L'} ${gf}-${ga}</span>`:`<span class="m">${g.time} ET</span>`)}${td(g[me+'Rest']??'–')}${td(g[me+'B2B']?'<span class="pill b2b">B2B</span>':'')}${td(g.hs==null?gc(gr.og):'')}${td(g.hs==null?gc(gr.dg):'')}</tr>`}))}</div>`}
if(tab==='injuries'){const I=X.inj[a]||[];h+=`<div class="card"><h3>Injury report (ESPN)</h3>${I.length?I.map(i=>`<div style="padding:8px 0;border-bottom:1px solid var(--b)"><b>${i.pid?pl(i.pid,i.name):esc(i.name)}</b> <span class="pill bk">${esc(i.status)}</span> <span class="m small">${i.date}</span><div class="small m">${esc(i.note)}</div></div>`).join(''):'<span class="m">No injuries listed.</span>'}</div>`}
if(tab==='proj'){const all=Object.entries(X.sim).filter(([k])=>D.teams[k].conf===t.conf).sort((x,y)=>y[1].mean-x[1].mean);
h+=`<div class="grid"><div class="card"><h3>Season projection (estimate)</h3><div class="kv"><div>Proj pts<b>${sim.mean}</b></div><div>80% range<b>${sim.p10}–${sim.p90}</b></div><div>Playoff odds<b>${pc(sim.playoff)}</b></div><div>Current pace<b>${sim.pace??'–'}</b></div><div>Model GF/gm<b>${f(sim.gf)}</b></div><div>Model GA/gm<b>${f(sim.ga)}</b></div></div>
<p class="small m">${X.sims} Monte Carlo sims of every remaining game. Each game uses Poisson goals from both teams' blended GF/GA rates (this season + 35% of last season + 15 games of league average), with home ×1.03. Ties split OT 50/50. Playoffs = top 3 per division + 2 wild cards. Tiebreaks are random. This is a simple model estimate.</p></div>
<div class="card"><h3>Projected ${t.conf} standings</h3>${tbl(['Team','Now','Proj pts','Range','Playoff'],all.map(([k,v])=>`<tr style="${k===a?'color:var(--a)':''}">${td(tm(k),k)}${td(D.teams[k].pts)}${td('<b>'+v.mean+'</b>',v.mean)}${td(v.p10+'–'+v.p90)}${td(pc(v.playoff),v.playoff)}</tr>`))}</div></div>
<div class="card"><h3>Player season projections</h3>${tbl(['Player','Pos','G now','Proj G','P now','Proj P','Proj SOG'],SK.filter(x=>x.proj).sort((x,y)=>y.proj.P-x.proj.P).map(x=>`<tr>${td(pl(x.id,x.name),x.name)}${td(x.pos)}${td(x.cur?.g??0)}${td(f(x.proj.G,1),x.proj.G)}${td(x.cur?.p??0)}${td(f(x.proj.P,1),x.proj.P)}${td(f(x.proj.S,0),x.proj.S)}</tr>`))}</div>`}
if(tab==='h2h'){const L=D.h2h.filter(x=>x.team===a);h+=`<div class="card">${tbl(['Player','Opp','Scope','Record','Expected','Next'],L.map(x=>`<tr>${td(pl(x.pid,x.name),x.name)}${td(tm(x.opp),x.opp)}${td(x.scope==='team'?'Since joining':'Career')}${td(`${x.val} ${x.stat} in ${x.n} GP`)}${td(f(x.exp,1))}${td(x.next?fmtD(x.next):'–',x.next||'9')}</tr>`))||'<span class="m">No flags.</span>'}</div>`}
if(tab==='hot'){const hs=[...H].sort((x,y)=>y.score-x.score);const rw=x=>`<div>${starBtn(x.pid)}${pl(x.pid,x.name)} <span class="m small">L10 ${x.l10.g}G ${x.l10.p}P · base ${f(x.base.p*10,1)}P/10</span><b style="float:right">${x.ptStreak?x.ptStreak+'-gm pt strk':''}</b></div>`;

function buildNav(){const A=Object.values(D.teams).sort((a,b)=>a.name.localeCompare(b.name));const open=ls.get('navteams',false);
$('#nav').innerHTML=V.map(([k,l])=>k==='teams'?`<a href="#teams" data-v="teams" onclick="const t=document.querySelector('.tl');t.classList.toggle('open');ls.set('navteams',t.classList.contains('open'))">Teams <span class="m">▾</span></a><div class="tl${open?' open':''}">${A.map(t=>`<a href="#team/${t.abbrev}" data-t="${t.abbrev}">${logo(t.abbrev)}${esc(t.name)}</a>`).join('')}</div>`:`<a href="#${k}" data-v="${k}">${l}</a>`).join('')}
function roles(H){const sec=(lab,arr)=>{const R=arr.filter(x=>x.toiDelta!=null).sort((a,b)=>b.toiDelta-a.toiDelta).slice(0,15);
return `<div class="card"><h3>Rising roles: ${lab}</h3>${tbl(['Player','Team','TOI L5','vs last szn','PP TOI now','PP last szn','SOG/gm L5','SOG/gm last szn'],R.map(x=>{const pd=x.ppToi!=null&&x.ppToiPrev!=null?x.ppToi-x.ppToiPrev:null,sd=x.shotsPrev!=null?x.l5.s/x.l5.n-x.shotsPrev:null;
return `<tr>${td(starBtn(x.pid)+pl(x.pid,x.name),x.name)}${td(x.team)}${td(f(x.l5.toi,1))}${td(`<span class="${x.toiDelta>0?'g':'r'}">${x.toiDelta>0?'+':''}${f(x.toiDelta,1)}</span>`,x.toiDelta)}${td(f(x.ppToi,1))}${td(f(x.ppToiPrev,1)+(pd!=null&&Math.abs(pd)>=0.5?` <span class="${pd>0?'g':'r'}">${pd>0?'▲':'▼'}</span>`:''),x.ppToiPrev)}${td(f(x.l5.s/x.l5.n,1))}${td(f(x.shotsPrev,1)+(sd!=null&&Math.abs(sd)>=0.5?` <span class="${sd>0?'g':'r'}">${sd>0?'▲':'▼'}</span>`:''),x.shotsPrev)}</tr>`}))}</div>`};
return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(520px,1fr))">${sec('Forwards',H.filter(x=>x.pos!=='D'))}${sec('Defensemen',H.filter(x=>x.pos==='D'))}</div><p class="small m">TOI and shots: last 5 games (may reach back into last season) vs last season's average. PP TOI: this season's average vs last season's. Per-game PP TOI isn't in the free game logs.</p>`}
function lineCard(a,compact){const L=D.lines[a];if(!L)return `<div class="card"><h3>${tm(a)}</h3><span class="m">No completed games yet.</span></div>`;const c=L.cur,nm=p=>{const n=c.names[p]||p;return D.players.find(x=>x.id===+p)?pl(p,n):esc(n)};
const u=(x,lab)=>`<div style="padding:4px 0;border-bottom:1px solid var(--b)"><span class="pill">${lab}</span> ${x.p.map(p=>{const isNew=(x.new||[]).includes(p);return isNew?`<b class="y" title="New to this unit vs previous game">${nm(p)} ●</b>`:nm(p)}).join(' – ')} <span class="m small" style="float:right">${Math.round(x.sec/60)}:${String(x.sec%60).padStart(2,'0')} ${lab.startsWith('PP')?'PP':'5v5'}</span></div>`;
return `<div class="card"><h3>${tm(a)} <span class="m small">from ${fmtD(c.date)} vs ${c.opp}${L.prev?` · changes vs ${fmtD(L.prev.date)} (${L.prev.opp}) in <span class="y">● gold</span>`:''}</span></h3>
${c.F.map((x,i)=>u(x,'L'+(i+1))).join('')}${c.D.map((x,i)=>u(x,'D'+(i+1))).join('')}${c.PP.map((x,i)=>u(x,'PP'+(i+1))).join('')||'<div class="small m">No PP time last game.</div>'}</div>`}
function lines(){const t=ls.get('lteam','ALL'),A=Object.keys(D.teams).sort();const T=t==='ALL'?A:[t];
return `<h2>Lines</h2><div class="filters"><select onchange="ls.set('lteam',this.value);route()"><option value="ALL">All teams</option>${A.map(a=>`<option${a===t?' selected':''}>${a}</option>`).join('')}</select></div>
<div class="note"><b>Derived, not official.</b> These are inferred from NHL shift charts for each team's most recent completed game. Forward trios and D pairs are the combinations that shared the most 5v5 ice time, and PP units are the 5 skaters who shared the most power-play time with that unit's PP leader. Times show shared ice time. Gold ● = the player wasn't on the closest-matching unit in the previous game. Healthy scratches and in-game shuffles can blur this.</div><br>
<div class="grid">${T.map(a=>lineCard(a)).join('')}</div>`}
function newsList(arr,n=30){return arr.slice(0,n).map(a=>`<div class="cand">${a.img?`<img src="${a.img}" style="width:84px;height:56px;border-radius:8px;object-fit:cover" loading="lazy" alt="">`:''}<div><a href="${a.u}" target="_blank" rel="noopener"><b>${esc(a.h)}</b></a><div class="small m">${a.t?new Date(a.t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET':''} · ${esc(a.type||'')}${a.nteams>4?' · league-wide':a.teams?.length?' · '+a.teams.map(esc).join(', '):''}</div><div class="small">${esc(a.d||'')}</div></div></div>`).join('')||'<span class="m">No articles.</span>'}
function news(){const t=ls.get('nteam','ALL'),A=Object.keys(D.teams).sort();return `<h2>News</h2><div class="filters"><select onchange="ls.set('nteam',this.value);route()"><option value="ALL">League-wide</option>${A.map(a=>`<option${a===t?' selected':''}>${a}</option>`).join('')}</select></div>
<div class="card">${newsList(t==='ALL'?D.news.league:(D.news.teams[t]||[]))}<p class="small m">Source: ESPN NHL news feed, refreshed with every data run. Links open ESPN.</p></div>`}

async function route(){const [v,arg,arg2]=(location.hash.slice(1)||'slate').split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='team'&&a.dataset.t===arg)));document.body.classList.remove('navopen');
const el=$('#app');try{const html=v==='player'?await player(arg):v==='team'?team(arg,arg2):({slate,schedule,teams,players,war,h2h,goalies,method,hot,watch,matchups,lines,news}[v]||slate)();el.innerHTML=html;sortable(el)}catch(e){console.error(e);el.innerHTML='<div class="card r">Something went wrong rendering this view.</div>'}
if(v!==route._v)scrollTo(0,0);route._v=v}
(async()=>{
try{D.meta=await J('data/meta.json');$('#badge').textContent='Data updated '+D.meta.updatedET;
const ks=['teams','games','players','slate','model','goalies','hot','grades','teamx','lines','news'];const r=await Promise.all([...ks.map(k=>J(`data/${k}.json`)),J('data/h2h_flags.json')]);ks.forEach((k,i)=>D[k]=r[i]);D.h2h=r[ks.length];
buildNav();addEventListener('hashchange',route);route()}catch(e){console.error(e);$('#app').innerHTML='<div class="card r">Could not load data.</div>'}})();
</script></body></html>
