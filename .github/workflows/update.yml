name: Refresh NHL data

# Event-driven: a 15-min dispatcher exits in seconds unless a window is due.
#  - Full rebuild: overnight ~2:30 AM ET (after late games go final) and morning ~7:00 AM ET (3-hour catch window each).
#  - Pre-game: ~90 and ~30 min before each game, rebuild only the teams playing (goalies, injuries, projections).
#  Each window fires once (data/refresh_state.json). Manual "Run workflow" = full rebuild.
on:
  schedule:
    - cron: "*/15 * * * *"
    # Dedicated anchors for the full-refresh windows. GitHub heavily throttles */15 schedules,
    # so these make sure the overnight (2:30-5:30 AM ET) and morning (7-10 AM ET) windows get hit.
    # Times are UTC and fall inside both windows in EDT and EST; the dispatcher dedupes each window.
    - cron: "37 7 * * *"
    - cron: "52 8 * * *"
    - cron: "7 12 * * *"
    - cron: "22 13 * * *"
    - cron: "42 15 * * *"   # morning-skate goalie window anchor (11:42 AM EDT)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = force full rebuild; auto = let the dispatcher pick (used by the live loop's pre-game kick)"
        default: full

permissions:
  contents: write

concurrency:
  group: refresh-nhl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Dispatch
        id: d
        env:
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' }}
        run: python3 scripts/dispatch.py
      - uses: actions/setup-python@v5
        if: steps.d.outputs.mode != 'none'
        with:
          python-version: "3.12"
      - name: Rebuild (full or pre-game targeted)
        if: steps.d.outputs.mode != 'none'
        env:
          TARGET_TEAMS: ${{ steps.d.outputs.mode == 'pregame' && steps.d.outputs.targets || '' }}
        run: python scripts/build.py
      - name: Cross-check free sources (optional)
        if: steps.d.outputs.mode != 'none'
        continue-on-error: true
        timeout-minutes: 5
        env:
          XMODE: ${{ steps.d.outputs.mode }}
        run: python scripts/nhl_xcheck.py
      - name: Season guard (current season from date + same-day live roster check)
        continue-on-error: true
        run: python scripts/season_guard.py
      - name: Commit
        if: steps.d.outputs.mode != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh (${{ steps.d.outputs.mode }} ${{ steps.d.outputs.targets }}) $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
