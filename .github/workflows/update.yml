name: Refresh NHL data

on:
  schedule:
    - cron: "0 11 * * *"    # ~7:00 AM ET (EDT); 6:00 AM in EST
    - cron: "30 3 * * *"    # ~11:30 PM ET (EDT); 10:30 PM in EST
    - cron: "0 12 * * *"    # 7:00 AM EST (winter)
    - cron: "30 4 * * *"    # 11:30 PM EST (winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nhl
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full rebuild
        run: python scripts/build.py
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/ ':!data/meta.json'; then
            echo "No data changes"; exit 0
          fi
          git commit -m "Refresh NHL data $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git pull --rebase && git push
