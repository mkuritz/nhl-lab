name: Live game-day feed

# Keeps today's scores, period/clock, confirmed starting goalies and player recaps fresh
# (official api-web.nhle.com only) on the `live` branch, which the page polls via raw.githubusercontent.com.
# One run loops every ~90s while any game is within 90 min of puck drop or in progress, then re-dispatches
# itself before the 6h job limit. Crons are only a backstop (GitHub throttles them).
# Also kicks the main refresh (pre-game goalie/lines rebuild) when its ~90/~30-min windows are due.
on:
  schedule:
    - cron: "*/10 15-23 * * *"
    - cron: "*/10 0-5 * * *"
    - cron: "40 9 * * *"    # overnight recap catch-up
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-nhl
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare live branch worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth 1 origin live:refs/remotes/origin/live
          git worktree add -q -B live ../live origin/live
      - name: Loop while games are on
        env:
          LIVE_OUT: ${{ github.workspace }}/../live
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          start=$(date +%s)
          while true; do
            python3 scripts/live_update.py > /tmp/out.txt 2>&1; cat /tmp/out.txt
            (cd ../live && git add -A && (git diff --cached --quiet || (git commit -qm "live $(TZ=America/New_York date '+%H:%M %Z')" && git push -q origin live)))
            # pre-game rebuild kick (dispatcher decides; dry run here, real run in update.yml)
            due=$(python3 scripts/dispatch.py --dry | grep -o 'mode=[a-z]*' | head -1)
            if [ "$due" = "mode=pregame" ] || [ "$due" = "mode=full" ]; then
              last=$(cat /tmp/kicked 2>/dev/null || echo 0); now=$(date +%s)
              if [ $((now-last)) -gt 900 ]; then gh workflow run update.yml -f mode=auto && echo "$now" > /tmp/kicked; fi
            fi
            act=$(python3 -c "import json,datetime as d;from zoneinfo import ZoneInfo as Z;l=json.load(open('../live/live.json'));n=d.datetime.now(d.timezone.utc);print(int(any(g['state'] in ('PRE','LIVE','CRIT') or (g['state']=='FUT' and g['startUTC'] and d.datetime.fromisoformat(g['startUTC'].replace('Z','+00:00'))-n<d.timedelta(minutes=95)) for g in l['games'])))")
            [ "$act" = "1" ] || { echo "No active games — done."; break; }
            if [ $(( $(date +%s) - start )) -gt 20400 ]; then echo "Handing off to a fresh run"; gh workflow run live.yml; break; fi
            sleep 90
            git pull -q --rebase origin main || true
          done
